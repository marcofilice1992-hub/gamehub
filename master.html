<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Co-op</title>
<!--
  COUCH CO-OP · master file
  One HTML file: the shared engine, the launcher, and every game.
  Open it in Chrome on the PC, press F11, and pick up two controllers.

  Layout of this file
    1. ENGINE core     tokens, saves, sound and music, input (two seats, practice bot), drawing helpers
    2. ENGINE runtime  camera, particles, grid, loop, scenes, game plug-in API
    3. ENGINE kit      world, tilemaps, platformer, rope, sprites, scripts, route finding,
                       hex grids, lighting, interact and carry, choice cards, simulate
    4. GAMES           the 15-slot manifest, the Test Range, the Engine Lab, then one block per game

  Developer keys: F3 timings, F4 colliders, F6 slow motion.
  From the browser console: Couch.simulate('test-range', { seed: 1 }) plays a game with bots and no screen.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07090D; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  noscript { color: #E4E7ED; font: 400 17px/1.5 "Segoe UI", system-ui, sans-serif; display: block; padding: 24px; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Couch Co-op game screen"></canvas>
<noscript>Couch Co-op needs JavaScript turned on.</noscript>
<script>
/* ==========================================================================
   COUCH CO-OP ENGINE · core
   Tokens, utilities, saves, sound, input (two seats), drawing helpers.
   Everything hangs off one global: Couch.
   ========================================================================== */
'use strict';
const Couch = {};
(() => {
const W = 1920, H = 1080;           // logical screen. Everything is drawn in these units.
const STEP = 1 / 120;               // fixed update step, seconds

// ---- Tokens (dark, low glare; the two players carry the colour) -----------
const T = {
  bg: '#0B0E13', s1: '#11151C', s2: '#171C25', s3: '#202632', bar: '#07090D',
  line: 'rgba(255,255,255,0.07)', line2: 'rgba(255,255,255,0.14)',
  text: '#E4E7ED', muted: '#A0A8B6', faint: '#8A93A3',
  p: ['#6EA2FF', '#F2A93B'],        // P1 blue (circle), P2 amber (diamond)
  pSoft: ['rgba(110,162,255,0.16)', 'rgba(242,169,59,0.16)'],
  good: '#2EBD85', bad: '#F0616D',
};
const FS = { xs: 22, sm: 28, md: 36, lg: 52, xl: 96 };
const FONT = "Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif";
const MONO = "'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace";

// ---- Utilities -------------------------------------------------------------
const U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  damp: (a, b, rate, dt) => b + (a - b) * Math.exp(-rate * dt),   // frame-rate independent smoothing
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
  easeOut: t => 1 - Math.pow(1 - t, 3),
  easeInOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  approach: (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target)),
  angleDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; },
  range: (rng, a, b) => a + rng() * (b - a),
  shuffle(rng, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  weighted(rng, items, weight) { let t = 0; for (const it of items) t += weight(it); let r = rng() * t; for (const it of items) { r -= weight(it); if (r <= 0) return it; } return items[items.length - 1]; },
  gauss(rng) { let u = 0, v = 0; while (!u) u = rng(); while (!v) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
  noise2(x, y, seed = 0) {                    // smooth random field, 0..1, for caves and terrain
    const h = (ix, iy) => { let n = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = h(x0, y0), b = h(x0 + 1, y0), c = h(x0, y0 + 1), d = h(x0 + 1, y0 + 1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  },
  pick: (rng, arr) => arr[Math.floor(rng() * arr.length)],
  time(s) {                                   // 161.34 -> "2:41.3"
    const m = Math.floor(s / 60), r = s - m * 60;
    return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
  },
};
function mulberry32(a) {                      // seeded random, so runs can be repeated
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- Saves (localStorage, with an in-memory fallback) -----------------------
const Save = {
  KEY: 'couch-coop-v1', persistent: false, data: null,
  load() {
    const reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const d = { v: 1, settings: { volume: 7, music: 5, rumble: true, shake: reduced ? 0 : 2, perf: false }, assists: [0, 0], games: {} };
    try {
      localStorage.setItem(this.KEY + ':t', '1'); localStorage.removeItem(this.KEY + ':t');
      this.persistent = true;
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.v === 1) {
          Object.assign(d.settings, s.settings || {});
          if (Array.isArray(s.assists)) d.assists = [s.assists[0] | 0, s.assists[1] | 0];
          if (s.games && typeof s.games === 'object') d.games = s.games;
        }
      }
    } catch (e) { this.persistent = false; }
    this.data = d;
  },
  flush() {
    if (!this.persistent) return;
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.persistent = false; }
  },
  peek(id) { return this.data.games[id] || { plays: 0, wins: 0, best: null, data: {} }; },   // read without creating
  game(id) {
    const g = this.data.games;
    if (!g[id]) g[id] = { plays: 0, wins: 0, best: null, data: {} };
    if (!g[id].data) g[id].data = {};
    return g[id];
  },
};

// ---- Sound (synthesised, no files) -----------------------------------------
const Sfx = {
  ctx: null, master: null, musicBus: null, mute: false, _noise: null,
  init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      this.musicBus = this.ctx.createGain(); this.musicBus.connect(this.ctx.destination);
      this.setVolume(Save.data.settings.volume); this.setMusicVolume(Save.data.settings.music);
    } catch (e) { this.ctx = null; }
  },
  get locked() { return !this.ctx || this.ctx.state !== 'running'; },
  unlock() { if (this.ctx && this.ctx.state !== 'running') { try { this.ctx.resume().catch(() => {}); } catch (e) {} } },
  setVolume(v) { if (this.master) this.master.gain.value = (v / 10) * 0.6; },
  setMusicVolume(v) { if (this.musicBus) this.musicBus.gain.value = (v / 10) * 0.5; },
  _out(node, o) {                               // o.pan: -1 left .. 1 right;  o.music: goes to the music volume
    const bus = o.music ? this.musicBus : this.master;
    if (o.pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = U.clamp(o.pan, -1, 1); node.connect(p); p.connect(bus); }
    else node.connect(bus);
  },
  tone(f, dur, o = {}) {
    if (this.locked || this.mute) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0), p = o.pitch || 1;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(f * p, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to * p, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); this._out(g, o);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  noise(dur, o = {}) {
    if (this.locked || this.mute) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    if (!this._noise) {
      this._noise = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = this._noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this._noise; src.loop = true;
    f.type = 'bandpass'; f.frequency.value = o.freq || 1000; f.Q.value = o.q || 0.8;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.25, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); this._out(g, o);
    src.start(t); src.stop(t + dur + 0.03);
  },
  // Named sounds. Games can add their own: Sfx.bank.myThing = o => { ... }
  bank: {
    move: (S, o) => S.tone(520, 0.04, { vol: 0.12, ...o }),
    select: (S, o) => { S.tone(660, 0.07, o); S.tone(990, 0.1, { delay: 0.05, ...o }); },
    back: (S, o) => S.tone(440, 0.09, { to: 300, vol: 0.16, ...o }),
    deny: (S, o) => S.tone(150, 0.13, { type: 'square', vol: 0.09, ...o }),
    join: (S, o) => { S.tone(523, 0.08, o); S.tone(784, 0.14, { delay: 0.07, ...o }); },
    leave: (S, o) => S.tone(392, 0.12, { to: 262, ...o }),
    tick: (S, o) => S.tone(880, 0.03, { vol: 0.08, ...o }),
    ready: (S, o) => { S.tone(587, 0.07, o); S.tone(880, 0.16, { delay: 0.06, ...o }); },
    pickup: (S, o) => S.tone(880, 0.06, { type: 'sine', vol: 0.16, ...o }),
    dash: (S, o) => S.noise(0.14, { freq: 1800, vol: 0.2, ...o }),
    hit: (S, o) => { S.noise(0.2, { freq: 500, vol: 0.3, ...o }); S.tone(120, 0.22, { to: 50, type: 'sawtooth', vol: 0.18, ...o }); },
    down: (S, o) => S.tone(300, 0.45, { to: 70, type: 'sawtooth', vol: 0.16, ...o }),
    revive: (S, o) => [392, 523, 659, 784].forEach((f, i) => S.tone(f, 0.12, { delay: i * 0.06, ...o })),
    open: (S, o) => { S.tone(196, 0.35, { to: 392, vol: 0.2, ...o }); S.noise(0.3, { freq: 300, vol: 0.12, ...o }); },
    win: (S, o) => [523, 659, 784, 1047].forEach((f, i) => S.tone(f, 0.22, { delay: i * 0.11, vol: 0.22, ...o })),
    lose: (S, o) => [392, 330, 262, 196].forEach((f, i) => S.tone(f, 0.26, { delay: i * 0.14, type: 'sawtooth', vol: 0.12, ...o })),
  },
  play(name, o) { const fn = this.bank[name]; if (fn) fn(this, o || {}); },
  // A small step sequencer. A song is { bpm, root (Hz), tracks: [{ notes: [semitones or null, ...], wave, oct, vol, len, at }] }.
  // Sixteen steps to the bar. A track with at: 0.5 only plays once music.intensity reaches 0.5, so games can layer tension.
  music: {
    song: null, step: 0, next: 0, timer: null, intensity: 1,
    play(song) { this.stop(); if (!Sfx.ctx) return; this.song = song; this.step = 0; this.next = 0; this.timer = setInterval(() => this._tick(), 40); },
    stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.song = null; },
    _tick() {
      const S = Sfx, sg = this.song; if (!sg || S.locked || S.mute) return;
      const c = S.ctx, spb = 60 / sg.bpm / 4;
      if (this.next < c.currentTime) this.next = c.currentTime + 0.05;
      while (this.next < c.currentTime + 0.2) {
        for (const tr of sg.tracks) {
          if ((tr.at || 0) > this.intensity) continue;
          const n = tr.notes[this.step % tr.notes.length]; if (n == null) continue;
          const delay = this.next - c.currentTime;
          if (tr.wave === 'noise') S.noise(tr.len || 0.04, { freq: tr.freq || 7000, q: 1.5, vol: tr.vol || 0.05, delay, music: true });
          else S.tone((sg.root || 110) * Math.pow(2, (n + (tr.oct || 0) * 12) / 12), (tr.len || 1) * spb, { type: tr.wave || 'triangle', vol: tr.vol || 0.08, delay, music: true });
        }
        this.step++; this.next += spb;
      }
    },
  },
};

// ---- Input: devices, two seats ----------------------------------------------
// Buttons use the browser's standard gamepad layout. Games ask a seat, never a device:
//   seat.move.x / .y      left stick (or D-pad), dead zone removed, length 0..1
//   seat.aim.x / .y       right stick
//   seat.pressed('a')     true on the step the button goes down
//   seat.down('a')        true while held;  seat.released('a');  seat.held('a') seconds held
//   seat.value('rt')      analog 0..1 (triggers)
//   seat.rumble(0.6, 150) strength 0..1, milliseconds
const BTN = { a: 0, b: 1, x: 2, y: 3, lb: 4, rb: 5, lt: 6, rt: 7, select: 8, start: 9, ls: 10, rs: 11, up: 12, down: 13, left: 14, right: 15 };
const KEYBOARDS = [
  { id: 'kb1', label: 'Keyboard, W A S D', move: ['KeyW', 'KeyS', 'KeyA', 'KeyD'],
    map: { a: 'Space', b: 'KeyQ', x: 'KeyE', y: 'KeyR', lb: 'Digit1', rb: 'Digit2', lt: 'ShiftLeft', rt: 'KeyF', start: 'Escape', select: 'Tab' },
    names: { a: 'Space', b: 'Q', x: 'E', y: 'R', lb: '1', rb: '2', lt: 'Shift', rt: 'F', start: 'Esc', select: 'Tab', move: 'W A S D', aim: 'none' } },
  { id: 'kb2', label: 'Keyboard, arrows', move: ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'],
    map: { a: 'Enter', b: 'Backspace', x: 'Period', y: 'Slash', lb: 'BracketLeft', rb: 'BracketRight', lt: 'ShiftRight', rt: 'ControlRight', start: 'KeyP', select: 'Backslash' },
    names: { a: 'Enter', b: 'Bksp', x: '.', y: '/', lb: '[', rb: ']', lt: 'R Shift', rt: 'R Ctrl', start: 'P', select: '\\', move: 'Arrows', aim: 'none' } },
];
const PAD_NAMES = {
  xbox: { a: 'A', b: 'B', x: 'X', y: 'Y', lb: 'LB', rb: 'RB', lt: 'LT', rt: 'RT', start: 'Start', select: 'Back', move: 'L stick', aim: 'R stick', ls: 'L3', rs: 'R3' },
  ps: { a: '', b: '', x: '', y: '', lb: 'L1', rb: 'R1', lt: 'L2', rt: 'R2', start: 'Options', select: 'Share', move: 'L stick', aim: 'R stick', ls: 'L3', rs: 'R3' },
  nin: { a: 'B', b: 'A', x: 'Y', y: 'X', lb: 'L', rb: 'R', lt: 'ZL', rt: 'ZR', start: '+', select: '−', move: 'L stick', aim: 'R stick', ls: 'L3', rs: 'R3' },
  touch: { a: 'Tap', b: '2-finger tap', x: 'n/a', y: 'n/a', lb: 'n/a', rb: 'n/a', lt: 'n/a', rt: 'n/a', start: 'Tap top right', select: 'n/a', move: 'Drag', aim: 'n/a' },
};

function makeDevice(id, kind, label, type, names) {
  return { id, kind, label, type, names, connected: true, seat: null, pad: null,
    lx: 0, ly: 0, rx: 0, ry: 0, b: new Float32Array(16), pb: new Float32Array(16) };
}
function deadzone(x, y) {                      // radial dead zone, rescaled so there is no jump at the edge
  const m = Math.hypot(x, y), inner = 0.18, outer = 0.95;
  if (m < inner) return [0, 0];
  const s = Math.min(1, (m - inner) / (outer - inner)) / m;
  return [x * s, y * s];
}

class Seat {
  constructor(index) {
    this.index = index; this.device = null;
    this.move = { x: 0, y: 0 }; this.aim = { x: 0, y: 0 };
    this._held = new Float32Array(16); this._navDir = { x: 0, y: 0 }; this._navT = 0; this._nav = { x: 0, y: 0 };
    this.joinT = 9;                           // seconds since joining, for the join pop
  }
  get joined() { return !!this.device; }
  get lost() { return !!this.device && !this.device.connected; }
  get bot() { return !!this.device && this.device.kind === 'bot'; }
  get type() { return this.device ? this.device.type : 'xbox'; }
  down(n) { const d = this.device; return !!d && d.b[BTN[n]] > 0.5; }
  pressed(n) { const d = this.device, i = BTN[n]; return !!d && d.b[i] > 0.5 && d.pb[i] <= 0.5; }
  released(n) { const d = this.device, i = BTN[n]; return !!d && d.b[i] <= 0.5 && d.pb[i] > 0.5; }
  value(n) { const d = this.device; return d ? d.b[BTN[n]] : 0; }
  held(n) { return this._held[BTN[n]]; }
  nav() { return this._nav; }                 // menu steps with auto-repeat: {x:-1|0|1, y:-1|0|1}
  rumble(strength = 0.5, ms = 120, weak) {
    const d = this.device;
    if (!d || !d.pad || !Save.data.settings.rumble) return;
    const va = d.pad.vibrationActuator;
    if (!va || !va.playEffect) return;
    try {
      const p = va.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: U.clamp(strength, 0, 1), weakMagnitude: U.clamp(weak == null ? strength : weak, 0, 1) });
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  _update(dt) {
    const d = this.device; this.joinT += dt;
    if (!d || !d.connected) { this.move.x = this.move.y = this.aim.x = this.aim.y = 0; this._nav.x = this._nav.y = 0; this._held.fill(0); return; }
    let mx = d.lx, my = d.ly;
    if (mx === 0 && my === 0) {               // D-pad stands in for the stick
      mx = (d.b[15] > 0.5 ? 1 : 0) - (d.b[14] > 0.5 ? 1 : 0);
      my = (d.b[13] > 0.5 ? 1 : 0) - (d.b[12] > 0.5 ? 1 : 0);
      const m = Math.hypot(mx, my); if (m > 1) { mx /= m; my /= m; }
    }
    this.move.x = mx; this.move.y = my; this.aim.x = d.rx; this.aim.y = d.ry;
    for (let i = 0; i < 16; i++) this._held[i] = d.b[i] > 0.5 ? this._held[i] + dt : 0;
    const nx = mx > 0.55 ? 1 : mx < -0.55 ? -1 : 0, ny = my > 0.55 ? 1 : my < -0.55 ? -1 : 0;
    this._nav.x = this._nav.y = 0;
    if (nx !== this._navDir.x || ny !== this._navDir.y) {
      this._navDir.x = nx; this._navDir.y = ny; this._navT = 0.36;
      this._nav.x = nx; this._nav.y = ny;
    } else if (nx || ny) {
      this._navT -= dt;
      if (this._navT <= 0) { this._navT = 0.13; this._nav.x = nx; this._nav.y = ny; }
    }
  }
}

const Input = {
  BTN, devs: new Map(), seats: [new Seat(0), new Seat(1)], keys: new Set(), _fresh: new Set(), _late: new Set(), padsBlocked: false,
  menu: { dx: 0, dy: 0, a: false, b: false, x: false, y: false, start: false, seat: 0 },
  lastType: 'xbox', lastPadType: 'xbox',
  touch: { id: null, x0: 0, y0: 0, x: 0, y: 0, t0: 0, moved: false, two: false, pulse: null, w: 1, h: 1 },

  init(canvas) {
    for (const k of KEYBOARDS) { const d = makeDevice(k.id, 'kb', k.label, 'kb', k.names); d.kb = k; this.devs.set(k.id, d); }
    const used = new Set(); for (const k of KEYBOARDS) { k.move.forEach(c => used.add(c)); Object.values(k.map).forEach(c => used.add(c)); }
    addEventListener('keydown', e => { if (used.has(e.code)) { if (!this.keys.has(e.code)) this._fresh.add(e.code); this.keys.add(e.code); if (!e.ctrlKey && !e.metaKey && !e.altKey) e.preventDefault(); } Sfx.unlock(); });
    addEventListener('keyup', e => { if (this._fresh.has(e.code)) this._late.add(e.code); else this.keys.delete(e.code); });
    addEventListener('blur', () => this.keys.clear());
    addEventListener('pointerdown', () => Sfx.unlock());
    const t = this.touch;
    const pos = e => { const r = canvas.getBoundingClientRect(); t.w = r.width; t.h = r.height; return r; };
    canvas.addEventListener('touchstart', e => {
      e.preventDefault(); Sfx.unlock();
      if (!this.devs.has('touch')) this.devs.set('touch', makeDevice('touch', 'touch', 'Touch screen', 'touch', PAD_NAMES.touch));
      if (t.id === null) { const c = e.changedTouches[0]; pos(e); t.id = c.identifier; t.x0 = t.x = c.clientX; t.y0 = t.y = c.clientY; t.t0 = performance.now(); t.moved = false; t.two = false; }
      else t.two = true;
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const c of e.changedTouches) if (c.identifier === t.id) { t.x = c.clientX; t.y = c.clientY; if (Math.hypot(t.x - t.x0, t.y - t.y0) > 18) t.moved = true; }

// ---- Spatial grid: "what is near this point?" without checking everything ----
class SpatialGrid {
  constructor(w, h, cell = 128, ox = 0, oy = 0) {
    this.cell = cell; this.ox = ox; this.oy = oy;
    this.cols = Math.max(1, Math.ceil(w / cell)); this.rows = Math.max(1, Math.ceil(h / cell));
    this.cells = Array.from({ length: this.cols * this.rows }, () => []);
    this.maxR = cell / 2;                                  // largest object radius you insert
  }
  _col(x) { return U.clamp(Math.floor((x - this.ox) / this.cell), 0, this.cols - 1); }
  _row(y) { return U.clamp(Math.floor((y - this.oy) / this.cell), 0, this.rows - 1); }
  clear() { for (const c of this.cells) c.length = 0; }
  insert(o) { this.cells[this._row(o.y) * this.cols + this._col(o.x)].push(o); }
  remove(o) { const a = this.cells[this._row(o.y) * this.cols + this._col(o.x)], k = a.indexOf(o); if (k >= 0) { a[k] = a[a.length - 1]; a.pop(); } }
  query(x, y, r, fn) {                                     // calls fn(obj) for everything that could be within r
    const R = r + this.maxR, c0 = this._col(x - R), c1 = this._col(x + R), r0 = this._row(y - R), r1 = this._row(y + R);
    for (let row = r0; row <= r1; row++) for (let col = c0; col <= c1; col++) {
      const a = this.cells[row * this.cols + col];
      for (let i = a.length - 1; i >= 0; i--) fn(a[i]);
    }
  }
}

// ---- Timers and tweens --------------------------------------------------------
class Timers {
  constructor() { this.list = []; }
  after(sec, fn) { this.list.push({ t: sec, fn }); }
  tween(obj, prop, to, sec, ease = U.easeOut) { this.list.push({ t: sec, d: sec, obj, prop, from: obj[prop], to, ease }); }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const m = this.list[i]; m.t -= dt;
      if (m.obj) m.obj[m.prop] = U.lerp(m.from, m.to, m.ease(U.clamp(1 - m.t / m.d, 0, 1)));
      if (m.t <= 0) { this.list.splice(i, 1); if (m.fn) m.fn(); }
    }
  }
}

// ---- A vertical menu used by pause, settings and results ---------------------
class Menu {
  constructor(items) { this.items = items; this.i = 0; }   // item: {label, value?:()=>string, adjust?:(dir)=>void, act?:()=>void}
  update(m) {
    const n = this.items.length;
    if (m.dy) { this.i = (this.i + m.dy + n) % n; Sfx.play('move'); }
    const it = this.items[this.i];
    if (m.dx && it.adjust) { it.adjust(m.dx); Sfx.play('tick'); }
    if (m.a) { if (it.act) { Sfx.play('select'); it.act(); } else if (it.adjust) { it.adjust(1); Sfx.play('tick'); } }
  }
  draw(x, y, w) {
    const rh = 76;
    this.items.forEach((it, k) => {
      const sel = k === this.i, yy = y + k * (rh + 8);
      G.rrect(x, yy, w, rh, 12, sel ? T.s3 : T.s1, sel ? T.text : T.line, sel ? 3 : 2);
      G.text(it.label, x + 28, yy + rh / 2 + 1, { size: FS.sm, weight: sel ? 500 : 400, color: sel ? T.text : T.muted, base: 'middle' });
      if (it.value) {
        const v = it.value();
        G.text(v, x + w - (it.adjust ? 64 : 28), yy + rh / 2 + 1, { size: FS.sm, color: T.text, align: 'right', base: 'middle', mono: /^[\d\s/.:%−+-]+$/.test(v) });
        if (it.adjust && sel) {
          G.text('›', x + w - 28, yy + rh / 2 - 1, { size: FS.sm, color: T.muted, align: 'right', base: 'middle' });
          G.text('‹', x + w - 72 - G.measure(v, { size: FS.sm, mono: /^[\d\s/.:%−+-]+$/.test(v) }), yy + rh / 2 - 1, { size: FS.sm, color: T.muted, align: 'right', base: 'middle' });
        }
      }
    });
    return this.items.length * (rh + 8);
  }
}

// =============================================================================
// Engine: canvas, fixed-step loop, scene stack
// =============================================================================
const Engine = {
  canvas: null, c: null, scale: 1, ox: 0, oy: 0,
  scenes: [], fade: { a: 1, dir: -1, next: null },
  t: 0, acc: 0, last: 0, trauma: 0, hitstop: 0, timeScale: 1, debug: false,
  perf: { fps: 0, upd: 0, drw: 0, steps: 0, _f: 0, _t: 0, _u: 0, _d: 0, _s: 0 },

  init() {
    Save.load();
    const cv = this.canvas = document.getElementById('screen');
    this.c = G.c = cv.getContext('2d', { alpha: false });
    Sfx.init(); Input.init(cv);
    const fit = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2), cw = Math.max(1, Math.round(innerWidth * dpr)), ch = Math.max(1, Math.round(innerHeight * dpr));
      cv.width = cw; cv.height = ch;
      this.scale = Math.min(cw / W, ch / H); this.ox = (cw - W * this.scale) / 2; this.oy = (ch - H * this.scale) / 2;
    };
    addEventListener('resize', fit); fit();
    cv.addEventListener('dblclick', () => {                 // a click may ask for fullscreen; a controller may not
      try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    });
    addEventListener('keydown', e => {                      // developer keys
      if (e.code === 'F3') { Save.data.settings.perf = !Save.data.settings.perf; Save.flush(); e.preventDefault(); }
      if (e.code === 'F4') { this.debug = !this.debug; e.preventDefault(); }                       // show colliders
      if (e.code === 'F6') { this.timeScale = this.timeScale === 1 ? 0.25 : 1; e.preventDefault(); } // slow motion
      if (e.code === 'F7' || e.code === 'F8') { const h = this.scenes.find(q => q.inner); if (h && h.inner.dev) { h.inner.dev(e.code); e.preventDefault(); } }   // per-game cheats
    });
    document.addEventListener('visibilitychange', () => { this.last = 0; });
    if (document.fonts && document.fonts.load) { for (const f of ['400 28px Geist', '500 28px Geist', '700 96px Geist', "400 28px 'JetBrains Mono'"]) { try { document.fonts.load(f).catch(() => {}); } catch (e) {} } }
    this.scenes = [new JoinScene()];
    requestAnimationFrame(t => this.frame(t));
  },

  frame(now) {
    requestAnimationFrame(t => this.frame(t));
    if (!this.last) this.last = now;
    let dt = (now - this.last) / 1000; this.last = now;
    if (dt > 0.25) dt = 0.25;
    this.acc += dt;
    const p = this.perf; let steps = 0, t0 = performance.now();
    while (this.acc >= STEP && steps < 10) { this.step(STEP); this.acc -= STEP; steps++; }
    if (steps === 10) this.acc = 0;                         // too far behind: drop the backlog instead of spiralling
    const t1 = performance.now();
    this.render(this.acc / STEP);
    const t2 = performance.now();
    p._f++; p._t += dt; p._u += t1 - t0; p._d += t2 - t1; p._s += steps;
    if (p._t >= 0.5) { p.fps = p._f / p._t; p.upd = p._u / p._f; p.drw = p._d / p._f; p.steps = p._s / p._f; p._f = p._t = p._u = p._d = p._s = 0; }
  },

  step(dt) {
    this.t += dt;
    Input.poll(dt);
    this.trauma = Math.max(0, this.trauma - dt * 1.6);
    const f = this.fade;
    if (f.dir === 1) {                                      // fading out: nothing updates, then swap scenes
      f.a += dt / 0.16;
      if (f.a >= 1) { f.a = 1; for (const s of this.scenes) if (s.exit) s.exit(); this.scenes = [f.next()]; f.next = null; f.dir = -1; this.trauma = 0; this.hitstop = 0; }
      return;
    }
    if (f.dir === -1) { f.a -= dt / 0.22; if (f.a <= 0) { f.a = 0; f.dir = 0; } }
    const top = this.scenes[this.scenes.length - 1];
    if (top) top.update(dt);
  },

  render(alpha) {
    const c = this.c;
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = T.bar; c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    c.setTransform(this.scale, 0, 0, this.scale, this.ox, this.oy);
    c.save(); c.beginPath(); c.rect(0, 0, W, H); c.clip();
    c.fillStyle = T.bg; c.fillRect(0, 0, W, H);
    let base = this.scenes.length - 1; while (base > 0 && this.scenes[base].overlay) base--;
    for (let i = Math.max(0, base); i < this.scenes.length; i++) this.scenes[i].draw(alpha);
    if (this.fade.a > 0) { c.globalAlpha = U.clamp(this.fade.a, 0, 1); c.fillStyle = T.bg; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
    if (Save.data.settings.perf) {
      const p = this.perf, host = this.scenes.find(q => q.kit);
      let s = `${p.fps.toFixed(0)} fps · update ${p.upd.toFixed(2)} ms · draw ${p.drw.toFixed(2)} ms`;
      if (host) for (const key in host.kit.watch) s += ` · ${key} ${host.kit.watch[key]}`;
      const w = G.measure(s, { size: FS.xs, mono: true }) + 32;
      G.rrect((W - w) / 2, H - 52, w, 40, 8, 'rgba(7,9,13,0.85)'); G.text(s, W / 2, H - 31, { size: FS.xs, mono: true, color: T.muted, align: 'center', base: 'middle' });
    }
    c.restore();
    if (this.canvas.height > this.canvas.width * 1.25) {     // tall phone: the 16:9 picture is tiny
      c.setTransform(1, 0, 0, 1, 0, 0); const cw = this.canvas.width, fs = Math.round(cw / 24);
      c.font = `400 ${fs}px ${Couch.FONT}`; c.fillStyle = T.muted; c.textAlign = 'center'; c.textBaseline = 'top';
      const y = this.oy + H * this.scale + fs * 1.6;
      c.fillText('Built for a big screen and two controllers.', cw / 2, y); c.fillText('Turn the phone sideways for a closer look.', cw / 2, y + fs * 1.5);
    }
  },

  go(make) { if (this.fade.dir === 1) return; this.fade.dir = 1; this.fade.next = make; },   // fade to a new scene
  push(scene) { this.scenes.push(scene); },
  pop() { const s = this.scenes.pop(); if (s && s.exit) s.exit(); },
  shake(amount) { this.trauma = Math.min(1, this.trauma + amount * (Save.data.settings.shake / 2)); },
};

// =============================================================================
// Game registry. A game is one call:
//
//   Couch.register({
//     id: 'swarm-night',                 // matches a slot in the manifest, or adds a new one
//     players: 2,                        // fewest players it needs (1 or 2)
//     best: 'low' | 'high' | null,       // which way a better score runs
//     how: ['Up to three short lines.'],
//     controls: [['move','Move'], ['a','Dash']],          // or [[...P1 rows], [...P2 rows]] when seats differ
//     assistText: ['Off', 'Light: …', 'Strong: …'],       // what the assist levels mean in this game
//     create(k) { return { update(dt) {}, draw(alpha) {}, exit() {} }; }
//   });
//
// k is the game kit: k.players (seats), k.rng, k.time, k.assist(i), k.shake(n), k.hitstop(sec),
// k.finish({won, score, stats, note}), k.save (an object that persists), plus Camera, Particles,
// Floaters, SpatialGrid, Timers, G, U, T, FS, Sfx, W, H.
// =============================================================================
const games = [];
function register(def) {
  const slot = games.find(g => g.id === def.id);
  if (slot) Object.assign(slot, def); else games.push(def);
  return slot || def;
}
function makeKit(def, opt = {}) {
  const M = Couch.modules, sim = !!opt.sim;
  const seed = opt.seed != null ? opt.seed >>> 0 : (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  return {
    def, W, H, T, FS, G, U, Sfx, BTN: Couch.BTN, c: Engine.c, time: 0, sim, seed,
    players: opt.players || Input.joined(), seats: Input.seats, rng: mulberry32(seed),
    save: sim ? {} : Save.game(def.id).data,
    Camera, Particles, Floaters, SpatialGrid, Timers, ...M,
    timers: new Timers(), routines: new M.Routines(), events: new M.Events(),
    toasts: [], watch: {}, result: null, scale: 1, _slow: 0,
    assist: i => (opt.assists ? opt.assists[i] | 0 : Save.data.assists[i] | 0),
    shake: n => { if (!sim) Engine.shake(n); }, hitstop: sec => { if (!sim) Engine.hitstop = Math.max(Engine.hitstop, sec); },
    after(sec, fn) { this.timers.after(sec, fn); }, tween(obj, prop, to, sec, ease) { this.timers.tween(obj, prop, to, sec, ease); },
    run(gen) { return this.routines.run(gen); },                       // a script with waits
    on(name, fn) { return this.events.on(name, fn); }, emit(name, data) { this.events.emit(name, data); },
    slowmo(scale, sec) { this.scale = scale; this._slow = sec; },       // sec is real time
    toast(text, o = {}) { this.toasts.push({ text, t: o.time || 2.6, max: o.time || 2.6, seat: o.seat, color: o.color }); if (this.toasts.length > 4) this.toasts.shift(); },
    choose(o) {                                                        // pick-one cards; the game waits underneath
      const h = Couch.makeHandle();
      if (sim) h.resolve(o.pick ? o.pick(o.options, this.rng) : Math.floor(this.rng() * o.options.length));
      else Engine.push(new Couch.ChoiceScene(this, o, h));
      return h;
    },
    sfxAt(name, wx, cam, o) { const sx = cam ? cam.toScreen(wx, 0).x : wx; Sfx.play(name, { pan: U.clamp((sx - W / 2) / (W / 2), -1, 1) * 0.8, ...o }); },
    _tick(dt) {
      this.timers.update(dt); this.routines.update(dt);
      for (let i = this.toasts.length - 1; i >= 0; i--) if ((this.toasts[i].t -= dt) <= 0) this.toasts.splice(i, 1);
    },
    finished: false,
    finish(result) {
      if (this.finished) return; this.finished = true; this.result = result;
      if (sim) return;
      const g = Save.game(def.id); g.plays++; if (result.won) g.wins++;
      let isBest = false;
      if (result.won && def.best && typeof result.score === 'number') {
        isBest = g.best == null || (def.best === 'low' ? result.score < g.best : result.score > g.best);
        if (isBest) g.best = result.score;
      }
      Save.flush(); Sfx.play(result.won ? 'win' : 'lose');
      Engine.go(() => new ResultsScene(def, result, isBest));
    },
  };
}
const fmtScore = (def, v) => (v == null ? 'none yet' : def.formatScore ? def.formatScore(v) : def.best === 'low' ? U.time(v) : String(v));

// ---- Join: each player claims a seat -----------------------------------------
class JoinScene {
  update(dt) {
    const seats = Input.seats, fresh = new Set();
    for (const d of Input.joiners()) {
      const s = seats.find(q => !q.joined); if (!s) break;
      Input.assign(d, s); fresh.add(s); Sfx.play('join', { pitch: s.index ? 1.25 : 1 }); s.rumble(0.5, 140);
    }
    for (const s of seats) {
      if (!s.joined || fresh.has(s) || s.lost || s.bot) continue;
      if (s.pressed('y')) {                                  // a practice bot takes the empty seat, for testing alone
        const b = seats.find(q => q.bot), free = seats.find(q => !q.joined);
        if (b) { Input.removeBot(b); Sfx.play('leave'); } else if (free) { Input.addBot(free); Sfx.play('join', { pitch: 1.5 }); }
        continue;
      }
      if (s.pressed('b')) { Input.unassign(s); const b = seats.find(q => q.bot); if (b && !seats.some(q => q.joined && !q.bot)) Input.removeBot(b); Sfx.play('leave'); continue; }
      if (s.pressed('a') || s.pressed('start')) { Sfx.play('select'); Engine.go(() => new LauncherScene()); return; }
    }
    for (const s of seats) if (s.lost) Input.unassign(s);
  }
  draw() {
    const seats = Input.seats, n = Input.joined().length;
    G.eyebrow('15 games for two', 120, 236);
    G.text('Couch Co-op', 114, 340, { size: FS.xl, weight: 700 });
    G.text('Pick up a controller each.', 120, 404, { size: FS.sm, color: T.muted });
    seats.forEach((s, i) => {
      const x = 120 + i * 880, y = 488, w = 800, h = 300, on = s.joined;
      G.rrect(x, y, w, h, 16, on ? T.s2 : T.s1, on ? T.p[i] : T.line, on ? 3 : 2);
      const pop = on ? 1 + 0.25 * Math.max(0, 1 - s.joinT / 0.18) : 1;
      G.marker(i, x + 110, y + h / 2, 52 * pop, { hollow: !on, color: on ? T.p[i] : T.faint, lw: 4 });
      G.eyebrow('Player ' + (i + 1), x + 216, y + 104, { color: on ? T.p[i] : T.muted });
      if (on) {
        G.text(s.device.label, x + 216, y + 162, { size: FS.md, weight: 500 });
        if (s.bot) G.inline(x + 216, y + 214, [{ btn: 'y' }, '  on the other controller to remove'], Input.lastType, { size: FS.xs, color: T.muted });
        else G.inline(x + 216, y + 214, [{ btn: 'b' }, '  to leave'], s.type, { size: FS.xs, color: T.muted, names: s.device.names });
      } else {
        G.inline(x + 216, y + 150, ['Press ', { btn: 'a' }, ' to join'], Input.lastPadType, { size: FS.md, weight: 500 });
        G.text('No controller? ' + (i ? 'Enter' : 'Space') + ' on the keyboard, or tap.', x + 216, y + 214, { size: FS.xs, color: T.faint });
      }
    });
    const y = 872;
    if (n === 2) G.inline(120, y, ['Both in. Press ', { btn: 'a' }, ' to start.'], Input.lastType, { size: FS.sm });
    else if (n === 1) G.inline(120, y, ['Waiting for player 2. Press ', { btn: 'y' }, ' for a practice bot, or ', { btn: 'a' }, ' to go on alone.'], Input.lastType, { size: FS.sm, color: T.muted });
    else G.text('Waiting for players.', 120, y, { size: FS.sm, color: T.muted, base: 'middle' });
    G.text('Fullscreen: F11, or double-click', 60, 1036, { size: FS.xs, color: T.faint, base: 'middle' });
    drawStatus(1036);
  }
}

// ---- Launcher: the 15 slots, by group ----------------------------------------
const GROUPS = ['Chaos kitchen', 'Tethered and puzzle', 'Asymmetric', 'Run-based action', 'Cosy and long-form'];
const UTIL = [
  { id: 'test-range', title: 'Test Range', line: 'A small complete game' },
  { id: 'engine-lab', title: 'Engine Lab', line: 'Platforms, swarm, workshop' },
  { id: '@pads', title: 'Controller test', line: 'Sticks, buttons and rumble' },
  { id: '@settings', title: 'Settings', line: 'Volume, rumble, screen shake' },
];
class LauncherScene {
  constructor(focusId) {
    this.col = 0; this.row = 3; this.u = 0; this.deny = 0;
    const slots = games.filter(g => g.n);
    if (focusId) {
      const g = slots.find(q => q.id === focusId), u = UTIL.findIndex(q => q.id === focusId);
      if (g) { this.col = Math.floor((g.n - 1) / 3); this.row = (g.n - 1) % 3; } else if (u >= 0) { this.u = u; }
    } else {
      const g = slots.find(q => q.create); if (g) { this.col = Math.floor((g.n - 1) / 3); this.row = (g.n - 1) % 3; }
    }
  }
  current() {
    if (this.row === 3) { const u = UTIL[this.u]; return games.find(g => g.id === u.id) || u; }
    return games.find(g => g.n === this.col * 3 + this.row + 1);
  }
  update(dt) {
    const m = Input.menu; this.deny = Math.max(0, this.deny - dt);
    const last = UTIL.length - 1;
    if (m.dy) { const r = U.clamp(this.row + m.dy, 0, 3); if (r !== this.row) { if (r === 3) this.u = Math.round(this.col * last / 4); else if (this.row === 3) this.col = Math.round(this.u * 4 / last); this.row = r; Sfx.play('move'); } }
    if (m.dx) {
      if (this.row === 3) { const u = U.clamp(this.u + m.dx, 0, last); if (u !== this.u) { this.u = u; Sfx.play('move'); } }
      else { const c = U.clamp(this.col + m.dx, 0, 4); if (c !== this.col) { this.col = c; Sfx.play('move'); } }
    }
    if (m.b) { Sfx.play('back'); Engine.go(() => new JoinScene()); return; }
    if (m.a) {
      const g = this.current();
      if (g.id === '@pads') { Sfx.play('select'); Engine.go(() => new PadTestScene()); }
      else if (g.id === '@settings') { Sfx.play('select'); Engine.push(new SettingsScene()); }
      else if (g.create) { Sfx.play('select'); Engine.go(() => new BriefScene(g)); }
      else { Sfx.play('deny'); this.deny = 0.3; }
    }
  }
  draw() {
    G.text('Couch Co-op', 58, 104, { size: FS.lg, weight: 700 });
    drawSeatChips(W - 60, 84);
    const cw = 344, ch = 196, gap = 20, x0 = 60, y0 = 204;
    GROUPS.forEach((name, col) => G.eyebrow(name, x0 + col * (cw + gap), 178, { color: T.faint }));
    const cur = this.current();
    for (const g of games) {
      if (!g.n) continue;
      const col = Math.floor((g.n - 1) / 3), row = (g.n - 1) % 3, sel = g === cur, built = !!g.create;
      let x = x0 + col * (cw + gap), y = y0 + row * (ch + gap);
      if (sel && this.deny > 0) x += Math.sin(this.deny * 60) * 6 * (this.deny / 0.3);
      G.rrect(x, y, cw, ch, 14, sel ? T.s3 : built ? T.s2 : T.s1, sel ? T.text : T.line, sel ? 3 : 2);
      G.text(String(g.n).padStart(2, '0'), x + 24, y + 44, { size: FS.xs, mono: true, color: T.faint });
      if (built) { G.circle(x + cw - 132, y + 37, 6, T.good); G.text('Playable', x + cw - 24, y + 44, { size: FS.xs, weight: 500, color: T.good, align: 'right' }); }
      else G.text('Not built', x + cw - 24, y + 44, { size: FS.xs, color: T.faint, align: 'right' });
      G.text(g.title, x + 24, y + 96, { size: FS.sm, weight: 700, color: built || sel ? T.text : T.muted });
      G.wrap(g.line, x + 24, y + 134, cw - 48, 30, { size: FS.xs, color: built || sel ? T.muted : T.faint }, 2);
    }
    // Detail line for whatever is selected
    const dy = 876;
    if (cur.n) {
      const st = Save.peek(cur.id);
      const bits = [cur.pace + ' pace', cur.create ? (cur.best ? 'Best: ' + fmtScore(cur, st.best) : st.plays + ' plays') : 'Not built yet. Size: ' + ({ S: 'a weekend', M: 'two or three weekends', L: 'a month of evenings' })[cur.size]];
      G.text(cur.title, x0, dy, { size: FS.xs, weight: 700, base: 'middle' });
      G.text(bits.join('  ·  '), x0 + G.measure(cur.title, { size: FS.xs, weight: 700 }) + 20, dy, { size: FS.xs, color: T.muted, base: 'middle' });
    }
    // Utility strip
    const uw = (W - 120 - 20 * (UTIL.length - 1)) / UTIL.length, uy = 904, uh = 92;
    UTIL.forEach((u, k) => {
      const sel = this.row === 3 && this.u === k, x = x0 + k * (uw + 20);
      G.rrect(x, uy, uw, uh, 14, sel ? T.s3 : T.s1, sel ? T.text : T.line, sel ? 3 : 2);
      G.text(u.title, x + 24, uy + 40, { size: FS.sm, weight: 500, color: sel ? T.text : T.muted });
      G.text(u.line, x + 24, uy + 70, { size: FS.xs, color: T.faint });
    });
    G.hints(x0, 1042, [['a', cur.create || String(cur.id)[0] === '@' ? 'Open' : 'Not built yet'], ['b', 'Change seats']], Input.lastType);
    drawStatus(1042);
  }
}

// ---- Brief: how to play, assists, both hold A to start -------------------------
const ASSIST = ['Off', 'Light', 'Strong'];
class BriefScene {
  constructor(def) { this.def = def; this.ready = [false, false]; this.hold = [0, 0]; this.players = Input.joined(); }
  update(dt) {
    const def = this.def, need = def.players || 2, ps = this.players = Input.joined().filter(s => !s.lost);
    const blocked = ps.length < need;
    let anyReady = false;
    for (const s of ps) {
      const i = s.index;
      if (s.bot) { this.ready[i] = true; continue; }
      if (this.ready[i]) { anyReady = true; if (s.pressed('b')) { this.ready[i] = false; Sfx.play('back'); return; } continue; }
      const n = s.nav();
      if (n.x) { Save.data.assists[i] = U.clamp((Save.data.assists[i] | 0) + n.x, 0, 2); Save.flush(); Sfx.play('tick'); }
      if (!blocked && s.down('a')) { this.hold[i] += dt; if (this.hold[i] >= 0.5) { this.ready[i] = true; Sfx.play('ready', { pitch: i ? 1.25 : 1 }); s.rumble(0.4, 100); } }
      else this.hold[i] = Math.max(0, this.hold[i] - dt * 3);
    }
    if (!anyReady) for (const s of ps) if (s.pressed('b')) { Sfx.play('back'); Engine.go(() => new LauncherScene(def.id)); return; }
    if (!blocked && ps.length && ps.every(s => this.ready[s.index])) Engine.go(() => new GameHost(def));
  }
  draw() {
    const def = this.def, ps = this.players, need = def.players || 2, st = Save.peek(def.id);
    G.eyebrow(def.n ? `${GROUPS[Math.floor((def.n - 1) / 3)]} · ${String(def.n).padStart(2, '0')}` : 'Engine', 120, 216);
    G.text(def.title, 118, 296, { size: FS.lg, weight: 700 });
    let y = 352 + 36 * (G.wrap(def.line, 120, 352, 760, 36, { size: FS.sm, color: T.muted }) - 1);
    y += 84;
    (def.how || []).forEach((line, k) => {
      G.text(String(k + 1), 120, y, { size: FS.xs, mono: true, color: T.faint });
      y += 40 * G.wrap(line, 164, y, 716, 40, { size: FS.sm }) + 16;
    });
    const info = [st.plays + (st.plays === 1 ? ' play' : ' plays')]; if (def.best) info.push('Best: ' + fmtScore(def, st.best));
    G.text(info.join('  ·  '), 120, 900, { size: FS.xs, color: T.faint });
    if (ps.length < need) G.text('This one needs two players. Go back and join a second controller.', 120, 960, { size: FS.sm, color: T.bad });
    const ph = 392, px = 1000, pw = 800, py0 = ps.length > 1 ? 112 : 320;
    ps.forEach((s, k) => {
      const i = s.index, y0 = py0 + k * (ph + 24), rdy = this.ready[i], names = s.device.names;
      G.rrect(px, y0, pw, ph, 16, T.s1, rdy ? T.p[i] : T.line, rdy ? 3 : 2);
      G.marker(i, px + 56, y0 + 58, 20);
      G.eyebrow('Player ' + (i + 1), px + 96, y0 + 54, { color: T.p[i] });
      G.text(s.device.label + (s.bot && !def.bots ? ' (stands still in this game)' : ''), px + 96, y0 + 84, { size: FS.xs, color: T.faint });
      const rows = Array.isArray(def.controls && def.controls[0] && def.controls[0][0]) ? (def.controls[i] || def.controls[0]) : (def.controls || []);
      const rh = Math.min(48, 176 / Math.max(1, rows.length));
      rows.forEach(([btn, label], r) => {
        const yy = y0 + 136 + r * rh;
        G.glyph(s.type, btn, px + 40, yy, Math.min(38, rh - 8), { names });
        G.text(label, px + 240, yy + 1, { size: rh < 44 ? FS.xs : FS.sm, base: 'middle' });
      });
      // assist
      const ay = y0 + ph - 68, lvl = Save.data.assists[i] | 0;
      G.eyebrow('Assist', px + 40, ay, { base: 'middle' });
      G.text((rdy || s.bot ? '' : '‹  ') + ASSIST[lvl] + (rdy || s.bot ? '' : '  ›'), px + 240, ay + 1, { size: FS.sm, weight: 500, base: 'middle', color: lvl ? T.text : T.muted });
      const at = def.assistText && def.assistText[lvl];
      if (at && lvl) G.text(at, px + 240, ay + 34, { size: FS.xs, color: T.faint, base: 'middle' });
      // ready
      const rx = px + pw - 248;
      if (rdy) { G.tick(rx + 20, ay, 14, T.good); G.text('Ready', rx + 52, ay + 1, { size: FS.sm, weight: 700, color: T.good, base: 'middle' }); }
      else {
        G.inline(rx, ay - 14, ['Hold ', { btn: 'a' }], s.type, { size: FS.xs, color: T.muted, names });
        G.bar(rx, ay + 16, 208, 8, this.hold[i] / 0.5, T.p[i]);
      }
    });
    G.hints(120, 1042, [['b', ps.some(s => !s.bot && this.ready[s.index]) ? 'Not ready' : 'Back']], Input.lastType);
  }
}

// ---- Game host: runs a game, owns pause and dropped controllers ----------------
class GameHost {
  constructor(def) { this.def = def; this.kit = makeKit(def); this.inner = def.create(this.kit); }
  update(dt) {
    const k = this.kit;
    if (k.players.some(s => s.lost)) { Engine.push(new DisconnectScene(this.def)); return; }
    if (!k.finished) for (const s of k.players) if (s.pressed('start')) { Sfx.play('back'); Engine.push(new PauseScene(this.def, s.index)); return; }
    if (Engine.hitstop > 0) { Engine.hitstop -= dt; return; }
    if (k._slow > 0) { k._slow -= dt; if (k._slow <= 0) k.scale = 1; }
    const gdt = dt * k.scale * Engine.timeScale, inner = this.inner;
    if (inner.bot) for (const s of k.players) if (s.bot) { s.device.ctl.clear(); inner.bot(s, s.device.ctl); }
    k.time += gdt; k._tick(gdt); inner.update(gdt);
  }
  draw(alpha) {
    this.inner.draw(alpha);
    this.kit.toasts.forEach((t, i) => {                      // banners, newest at the bottom
      const a = Math.min(1, t.t / 0.3, (t.max - t.t) / 0.15), w = G.measure(t.text, { size: FS.sm, weight: 500 }) + (t.seat != null ? 100 : 64), x = (W - w) / 2, y = 148 + i * 68;
      Engine.c.globalAlpha = U.clamp(a, 0, 1);
      G.rrect(x, y, w, 56, 28, 'rgba(7,9,13,0.9)', t.color || (t.seat != null ? T.p[t.seat] : T.line2), 2);
      if (t.seat != null) G.marker(t.seat, x + 34, y + 28, 10);
      G.text(t.text, x + (t.seat != null ? 60 : 32), y + 29, { size: FS.sm, weight: 500, base: 'middle' });
      Engine.c.globalAlpha = 1;
    });
  }
  exit() { Sfx.music.stop(); if (this.inner.exit) this.inner.exit(); }
}

class DisconnectScene {
  constructor(def) { this.overlay = true; this.def = def; }
  update() {
    const lost = Input.seats.filter(s => s.lost);

    const d = Input.joiners()[0];
    if (d) { Input.assign(d, lost[0]); Sfx.play('join'); return; }
    for (const s of Input.seats) if (s.joined && !s.lost && s.pressed('start')) { for (const q of lost) Input.unassign(q); Engine.go(() => new LauncherScene(this.def.id)); return; }
  }
  draw() {
    dim(); const lost = Input.seats.filter(s => s.lost), i = lost.length ? lost[0].index : 0, x = 480;

<script>
/* ==========================================================================
   COUCH CO-OP ENGINE · game kit
   The systems games are built from. Every class here is also on the kit a
   game receives, so inside a game it is k.World, k.Tilemap, k.Rope and so on.

     World        entities with tags, fast "what is near", walls, rays
     Tilemap      levels from rows of text, collision, rays, cached drawing
     Platformer   a jumping body with coyote time and jump buffering
     Rope         a rope between two bodies
     Sprite       draw a shape once, stamp it thousands of times
     Routines     scripts written top to bottom with waits (generators)
     FSM, Events  state machines and messages
     Path         A* route finding;  FlowField: many chasers, one cheap search
     Hex          hex-grid maths for board games
     Darkness     lights and vision cones
     Interact     "press A here" prompts, hold-to-use, carry and throw
     ChoiceScene  pick-one-of-these cards (upgrades, votes)
     simulate     run a game with bots, no screen, as fast as possible
   ========================================================================== */
(() => {
const { W, H, STEP, T, FS, U, G, Sfx, Input, Engine, SpatialGrid, Timers, BTN } = Couch;

// ---- Pool: reuse objects instead of creating thousands -------------------------
class Pool {
  constructor(make, reset) { this.make = make; this.reset = reset; this.free = []; }
  get() { const o = this.free.pop() || this.make(); if (this.reset) this.reset(o); return o; }
  put(o) { this.free.push(o); }
}

// ---- Sprite: bake a drawing to an image, then stamp it --------------------------
class Sprite {
  // draw(c) paints around 0,0. G helpers work inside it.
  static bake(w, h, draw, res = 2) {
    const cv = document.createElement('canvas'); cv.width = Math.ceil(w * res); cv.height = Math.ceil(h * res);
    const c = cv.getContext('2d'); c.scale(res, res); c.translate(w / 2, h / 2);
    const prev = G.c; G.c = c; try { draw(c); } finally { G.c = prev; }
    return new Sprite(cv, w, h);
  }
  constructor(img, w, h) { this.img = img; this.w = w; this.h = h; }
  spin(n = 32) { return new SpinSprite(this, n); }
  draw(c, x, y, rot = 0, scale = 1, alpha = 1) {
    if (alpha <= 0) return;
    const w = this.w * scale, h = this.h * scale;
    if (alpha !== 1) c.globalAlpha = alpha;
    if (rot) { c.translate(x, y); c.rotate(rot); c.drawImage(this.img, -w / 2, -h / 2, w, h); c.rotate(-rot); c.translate(-x, -y); }
    else c.drawImage(this.img, x - w / 2, y - h / 2, w, h);
    if (alpha !== 1) c.globalAlpha = 1;
  }
}
// The same sprite turned to n angles ahead of time, so a rotated draw is one plain stamp. Use for crowds.
//   const bug = k.Sprite.bake(40, 40, draw).spin(32);   bug.draw(c, x, y, angle)
class SpinSprite {

<script>
/* ==========================================================================
   GAMES
   The manifest lists all 15 slots. A slot becomes playable when a game
   registers under the same id with a create() function. Add each new game
   as its own block below the Test Range.
   ========================================================================== */
(() => {
const R = Couch.register;
[
  ['parcel-panic', 'Parcel Panic', 'Sort and load parcels across a split depot.', 'Frantic', 'M'],
  ['pit-crew', 'Pit Crew', 'Service race cars before the queue backs up.', 'Frantic', 'S'],
  ['last-orders', 'Last Orders', 'Run a cocktail bar with analog pouring.', 'Frantic', 'M'],
  ['tether', 'Tether', 'A platformer with the two of you roped together.', 'Medium', 'M'],
  ['push-comes-to-shove', 'Push Comes to Shove', 'Crate puzzles that need two pushers.', 'Calm', 'S'],
  ['polarity', 'Polarity', 'You are magnets that pull and push each other.', 'Medium', 'M'],
  ['mission-control', 'Mission Control', 'One flies the lander. One runs the power.', 'Medium', 'M'],
  ['heist-night', 'Heist Night', 'One sneaks in. One hacks doors and cameras.', 'Medium', 'L'],
  ['big-and-small', 'Big & Small', 'A strong slow one and a quick light one.', 'Medium', 'M'],
  ['tank-for-two', 'Tank for Two', 'One drives, one guns, same tank.', 'Frantic', 'S'],
  ['swarm-night', 'Swarm Night', 'Survive the swarm with shared upgrades.', 'Frantic', 'S'],
  ['deep-dive', 'Deep Dive', 'Dig down on one shared air hose.', 'Medium', 'M'],
  ['allotment', 'Allotment', 'A shared garden with no way to fail.', 'Calm', 'M'],
  ['slow-boat', 'Slow Boat', 'Sail and trade between islands.', 'Calm', 'L'],
  ['floodline', 'Floodline', 'A board game against a rising river.', 'Calm', 'M'],
].forEach(([id, title, line, pace, size], i) => R({ id, n: i + 1, title, line, pace, size, players: 2 }));
})();

/* --------------------------------------------------------------------------
   TEST RANGE · the engine demo, and the template for a real game.
   Collect every pellet. Both stand on a plate to open the vault. Drones knock
   you down; your partner revives you. Uses: seats, camera, spatial grid,
   particles, floaters, shake, hit-stop, rumble, sound, assists, saves, results.
   -------------------------------------------------------------------------- */
(() => {
const { T, FS, G, U, Sfx, W, H } = Couch;
const WORLD = { w: 2600, h: 1460 }, VAULT = { x: 1300, y: 730, r: 240 };
const PLATES = [{ x: 480, y: 730, r: 96 }, { x: 2120, y: 730, r: 96 }];

class TestRange {
  constructor(k) {
    this.k = k; const rng = k.rng, solo = k.players.length === 1;
    this.cam = new k.Camera({ minZoom: 0.5, maxZoom: 1, margin: 320, bounds: { x: -60, y: -60, w: WORLD.w + 120, h: WORLD.h + 120 } });
    this.fx = new k.Particles(1200); this.floats = new k.Floaters(); this.timers = new k.Timers();
    this.grid = new k.SpatialGrid(WORLD.w, WORLD.h, 150);
    this.pellets = 0; this.total = 0; this.open = false; this.openT = 0; this.over = 0;
    this.stats = { revives: 0, dashes: 0, knocks: 0 };
    const add = (x, y, gold) => { this.grid.insert({ x, y, r: gold ? 20 : 14, gold }); this.total++; };
    while (this.total < 60) {
      const x = U.range(rng, 90, WORLD.w - 90), y = U.range(rng, 90, WORLD.h - 90);
      if (U.dist(x, y, VAULT.x, VAULT.y) > VAULT.r + 70 && PLATES.every(p => U.dist(x, y, p.x, p.y) > p.r + 30)) add(x, y, false);
    }
    for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2; add(VAULT.x + Math.cos(a) * 130, VAULT.y + Math.sin(a) * 130, true); }
    this.players = k.players.map((seat, n) => ({
      seat, i: seat.index, x: VAULT.x + (solo ? 0 : n ? 140 : -140), y: VAULT.y + 440, vx: 0, vy: 0, r: 42,
      fx: 0, fy: -1, dash: 0, dashCd: 0, down: false, revive: 0, self: 0, safe: 0, shield: k.assist(seat.index), charge: 0, rumT: 0, ping: 0,
    }));
    this.drones = [];
    for (let i = 0; i < 6; i++) {
      const a = U.range(rng, 0, Math.PI * 2), top = i % 2 === 0;
      this.drones.push({ x: U.range(rng, 300, WORLD.w - 300), y: top ? U.range(rng, 120, 300) : U.range(rng, WORLD.h - 300, WORLD.h - 120), vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, r: 40, spin: a });
    }
    this.cam.follow(this.players, 0, true);
  }

  update(dt) {
    const k = this.k, ps = this.players;
    this.timers.update(dt); this.fx.update(dt); this.floats.update(dt);
    if (this.open) this.openT = Math.min(1, this.openT + dt * 2);

    for (const p of ps) {
      const s = p.seat; p.dashCd -= dt; p.safe -= dt; p.ping -= dt;
      if (p.down) {
        // Revive: partner stands close. Alone, you get back up after a wait.
        const mate = ps.find(q => q !== p && !q.down && U.dist(p.x, p.y, q.x, q.y) < 130);
        const need = [2.0, 1.4, 0.9][k.assist(p.i)];
        if (mate) p.revive += dt / need; else p.revive = Math.max(0, p.revive - dt * 0.5);
        if (ps.length === 1) p.revive += dt / 3.5;
        if (p.revive >= 1) {
          p.down = false; p.revive = 0; p.safe = 1.5; this.stats.revives++;
          Sfx.play('revive'); this.fx.burst(p.x, p.y, 26, { color: T.p[p.i], speed: [120, 420], life: 0.6 });
          this.floats.add('Back up', p.x, p.y - p.r - 36, { color: T.p[p.i], size: FS.md }); s.rumble(0.5, 160);
        }
        p.vx = p.vy = 0; continue;
      }
      // Move
      const mx = s.move.x, my = s.move.y, sp = 500;
      if (mx || my) { const m = Math.hypot(mx, my); p.fx = mx / m; p.fy = my / m; }
      p.vx = U.damp(p.vx, mx * sp, 14, dt); p.vy = U.damp(p.vy, my * sp, 14, dt);
      // Dash
      if (s.pressed('a') && p.dashCd <= 0) {
        p.dash = 0.16; p.dashCd = 0.9; this.stats.dashes++;
        Sfx.play('dash'); s.rumble(0.35, 90, 0.7);
        this.fx.burst(p.x, p.y, 14, { color: T.p[p.i], angle: Math.atan2(-p.fy, -p.fx), spread: 1.2, speed: [200, 600], life: 0.35, size: 9 });
      }
      let vx = p.vx, vy = p.vy;
      if (p.dash > 0) { p.dash -= dt; vx += p.fx * 1500; vy += p.fy * 1500; }
      p.x += vx * dt; p.y += vy * dt;
      // Ping, and the analog trigger
      if (s.pressed('x')) { p.ping = 0.6; Sfx.play('select', { pitch: p.i ? 1.2 : 1 }); this.floats.add('Here', p.x, p.y - p.r - 36, { color: T.p[p.i], size: FS.md }); }
      p.charge = s.value('rt'); p.rumT -= dt;
      if (p.charge > 0.1 && p.rumT <= 0) { s.rumble(0, 110, p.charge * 0.6); p.rumT = 0.1; }
      // Walls: the world edge, and the vault while it is shut
      p.x = U.clamp(p.x, p.r, WORLD.w - p.r); p.y = U.clamp(p.y, p.r, WORLD.h - p.r);
      if (!this.open) {
        const d = U.dist(p.x, p.y, VAULT.x, VAULT.y), min = VAULT.r + p.r;
        if (d < min && d > 0) { p.x = VAULT.x + ((p.x - VAULT.x) / d) * min; p.y = VAULT.y + ((p.y - VAULT.y) / d) * min; }
      }
      // Pellets near this player, found through the grid
      const got = [];
      this.grid.query(p.x, p.y, p.r + 20, o => { if (U.dist2(p.x, p.y, o.x, o.y) < (p.r + o.r + 6) ** 2) got.push(o); });
      for (const o of got) {
        this.grid.remove(o); this.pellets++;
        Sfx.play('pickup', { pitch: o.gold ? 1.5 : 1 + (this.pellets % 8) * 0.04 });
        this.fx.burst(o.x, o.y, o.gold ? 12 : 5, { color: o.gold ? T.good : T.text, speed: [60, 260], life: 0.4, size: 6 });
      }
    }

    // Plates: every player on a plate of their own opens the vault for good
    if (!this.open) {
      for (const pl of PLATES) pl.on = ps.some(p => !p.down && U.dist(p.x, p.y, pl.x, pl.y) < pl.r);
      const need = Math.min(ps.length, PLATES.length);
      if (PLATES.filter(pl => pl.on).length >= need) {
        this.open = true; Sfx.play('open'); k.shake(0.5); k.hitstop(0.06);
        for (const p of ps) p.seat.rumble(0.7, 260);
        this.fx.burst(VAULT.x, VAULT.y, 60, { color: T.good, speed: [200, 700], life: 0.8 });
        this.floats.add('Vault open', VAULT.x, VAULT.y - VAULT.r - 30, { color: T.good, size: FS.md, life: 1.6 });
      }
    }

    // Drones bounce around and knock players down
    for (const d of this.drones) {
      d.x += d.vx * dt; d.y += d.vy * dt; d.spin += dt * 2;
      if (d.x < d.r || d.x > WORLD.w - d.r) { d.vx *= -1; d.x = U.clamp(d.x, d.r, WORLD.w - d.r); }
      if (d.y < d.r || d.y > WORLD.h - d.r) { d.vy *= -1; d.y = U.clamp(d.y, d.r, WORLD.h - d.r); }
      const dv = U.dist(d.x, d.y, VAULT.x, VAULT.y), keep = VAULT.r + d.r + 40;   // the vault stays a safe room
      if (dv < keep) { const nx = (d.x - VAULT.x) / dv, ny = (d.y - VAULT.y) / dv, dot = d.vx * nx + d.vy * ny; if (dot < 0) { d.vx -= 2 * dot * nx; d.vy -= 2 * dot * ny; } d.x = VAULT.x + nx * keep; d.y = VAULT.y + ny * keep; }
      for (const p of ps) {
        if (p.down || p.safe > 0 || p.dash > 0 || this.over) continue;
        if (U.dist2(p.x, p.y, d.x, d.y) < (p.r + d.r) ** 2) {
          k.shake(0.45); k.hitstop(0.05); Sfx.play('hit'); p.seat.rumble(0.9, 220);
          this.fx.burst(p.x, p.y, 20, { color: T.bad, speed: [150, 520], life: 0.5 });
          if (p.shield > 0) { p.shield--; p.safe = 1.2; this.floats.add('Shield', p.x, p.y - p.r - 36, { color: T.muted, size: FS.md }); }
          else { p.down = true; p.revive = 0; this.stats.knocks++; Sfx.play('down'); }
        }
      }
    }

    this.cam.follow(ps, dt);

    // Win and lose
    if (!this.over) {
      if (this.pellets >= this.total) { this.over = 1; this.end(true); }
      else if (ps.length > 1 && ps.every(p => p.down)) { this.over = 1; this.timers.after(1.1, () => this.end(false)); }
    }
  }

  // The practice bot. The same function drives Couch.simulate('test-range') for balance runs.
  bot(seat, ctl) {
    const ps = this.players, p = ps.find(q => q.seat === seat); if (!p || p.down) return;
    const mate = ps.find(q => q !== p && q.down); let tx, ty;
    if (mate) { tx = mate.x; ty = mate.y; }
    else if (!this.open) { const pl = PLATES[ps.indexOf(p) % PLATES.length]; tx = pl.x; ty = pl.y; }
    else { let best = Infinity; for (const cell of this.grid.cells) for (const o of cell) { const d = U.dist2(p.x, p.y, o.x, o.y); if (d < best) { best = d; tx = o.x; ty = o.y; } } }
    if (tx == null) return;
    const dx = tx - p.x, dy = ty - p.y, m = Math.hypot(dx, dy); if (m > 20) { ctl.x = dx / m; ctl.y = dy / m; }
    if (p.dashCd <= 0 && this.drones.some(d => U.dist2(d.x, d.y, p.x, p.y) < 170 * 170)) ctl.set('a');
  }

  end(won) {
    const k = this.k, s = this.stats;
    k.finish({ won, score: k.time, title: won ? 'Range cleared' : 'Both down',
      note: won ? 'Every pellet collected.' : 'Nobody was left standing to revive the other.',
      stats: [['Pellets', this.pellets + ' / ' + this.total], ['Knock-downs', s.knocks], ['Revives', s.revives], ['Dashes', s.dashes]].concat(won ? [] : [['Time', U.time(k.time)]]) });
  }

  draw() {
    const k = this.k, c = k.c, cam = this.cam, ps = this.players;
    cam.begin(c);
    // floor: faint dots, then the edge
    const v = cam.view(), step = 100;
    c.fillStyle = 'rgba(255,255,255,0.06)';
    for (let x = Math.max(0, Math.floor(v.x / step) * step); x <= Math.min(WORLD.w, v.x + v.w); x += step)
      for (let y = Math.max(0, Math.floor(v.y / step) * step); y <= Math.min(WORLD.h, v.y + v.h); y += step) c.fillRect(x - 2, y - 2, 4, 4);
    G.rrect(0, 0, WORLD.w, WORLD.h, 24, null, T.line2, 4);
    // plates
    for (const pl of PLATES) {
      const on = pl.on || this.open;
      G.circle(pl.x, pl.y, pl.r, on ? 'rgba(46,189,133,0.14)' : T.s1, on ? T.good : T.line2, 4);
      G.circle(pl.x, pl.y, pl.r - 22, null, on ? T.good : T.line2, 2);
      if (!this.open) G.text('Plate', pl.x, pl.y + pl.r + 52, { size: FS.sm, color: T.faint, align: 'center' });
    }
    // vault
    c.save(); c.setLineDash(this.open ? [10, 26] : [28, 14]); c.globalAlpha = this.open ? 0.35 : 1;
    G.circle(VAULT.x, VAULT.y, VAULT.r, this.open ? null : T.s1, this.open ? T.good : T.muted, 5); c.restore();
    if (!this.open) G.text('Vault', VAULT.x, VAULT.y - VAULT.r - 28, { size: FS.sm, color: T.faint, align: 'center' });
    // pellets (only the cells in view)
    this.grid.query(v.x + v.w / 2, v.y + v.h / 2, Math.max(v.w, v.h) / 2, o => {
      if (o.gold) { G.circle(o.x, o.y, o.r, T.good); G.circle(o.x, o.y, o.r + 7, null, 'rgba(46,189,133,0.35)', 2); }
      else G.circle(o.x, o.y, o.r, '#C9CFDA');
    });
    // drones: red triangles
    for (const d of this.drones) {
      c.save(); c.translate(d.x, d.y); c.rotate(d.spin); c.beginPath();
      for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2; c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * d.r * 1.25, Math.sin(a) * d.r * 1.25); }
      c.closePath(); c.fillStyle = 'rgba(240,97,109,0.18)'; c.fill(); c.strokeStyle = T.bad; c.lineWidth = 4; c.stroke(); c.restore();
    }
    this.fx.draw(c);
    // players
    for (const p of ps) {
      const col = T.p[p.i];
      if (p.ping > 0) G.circle(p.x, p.y, p.r + (1 - p.ping / 0.6) * 220, null, col, 4 * (p.ping / 0.6));
      if (p.charge > 0.02) G.circle(p.x, p.y, p.r + 14 + p.charge * 60, null, col, 2);
      if (p.down) {
        G.marker(p.i, p.x, p.y, p.r, { hollow: true, lw: 4 });
        G.ring(p.x, p.y, p.r + 22, 1, T.s3, 8); G.ring(p.x, p.y, p.r + 22, p.revive, col, 8);
        G.text('Down', p.x, p.y - p.r - 48, { size: FS.sm, weight: 700, color: T.bad, align: 'center' });
      } else {
        c.globalAlpha = p.safe > 0 && Math.floor(p.safe * 12) % 2 ? 0.45 : 1;
        G.marker(p.i, p.x, p.y, p.r); c.globalAlpha = 1;
        G.circle(p.x + p.fx * (p.r - 14), p.y + p.fy * (p.r - 14), 8, T.bg);
        if (p.dashCd > 0) G.ring(p.x, p.y, p.r + 12, 1 - p.dashCd / 0.9, col, 4);
        for (let i = 0; i < p.shield; i++) G.circle(p.x - 10 + i * 20, p.y - p.r - 22, 6, null, T.muted, 2);
      }
      G.text('P' + (p.i + 1), p.x, p.y + p.r + 50, { size: FS.sm, weight: 700, color: col, align: 'center' });
    }
    this.floats.draw();
    cam.end(c);

    // HUD
    G.rrect(40, 40, 330, 96, 14, 'rgba(17,21,28,0.86)', T.line);
    G.eyebrow('Pellets', 64, 86);
    G.text(String(this.pellets).padStart(2, '0') + ' / ' + this.total, 346, 90, { size: FS.md, weight: 500, mono: true, align: 'right' });
    G.bar(64, 110, 282, 8, this.pellets / this.total, T.text);
    G.rrect(W / 2 - 110, 40, 220, 72, 14, 'rgba(17,21,28,0.86)', T.line);
    G.text(U.time(k.time), W / 2, 78, { size: FS.md, weight: 500, mono: true, align: 'center', base: 'middle' });
    const need = ps.length > 1 ? 'Both stand on a plate to open the vault' : 'Stand on a plate to open the vault';
    const msg = this.open ? 'Vault open' : need, mw = G.measure(msg, { size: FS.xs }) + 76;
    G.rrect(W - 40 - mw, 40, mw, 56, 28, 'rgba(17,21,28,0.86)', T.line);
    if (this.open) G.tick(W - 40 - mw + 32, 68, 9, T.good); else G.circle(W - 40 - mw + 32, 68, 7, null, T.muted, 2);
    G.text(msg, W - 64, 69, { size: FS.xs, color: this.open ? T.good : T.muted, align: 'right', base: 'middle' });
  }
}

Couch.register({
  id: 'test-range', title: 'Test Range', line: 'The engine demo. Collect every pellet together.',
  players: 1, bots: true, best: 'low', scoreLabel: 'Time',
  how: ['Collect all 70 pellets.', 'Each stand on a plate to open the vault.', 'Drones knock you down. Stand by your partner to get them up.'],
  controls: [['move', 'Move'], ['a', 'Dash through drones'], ['x', 'Ping'], ['rt', 'Analog trigger test']],
  assistText: ['', 'One shield, faster revive', 'Two shields, fastest revive'],
