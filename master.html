</script>
<script>
/* --------------------------------------------------------------------------
   ENGINE LAB · three rooms that exercise the game kit. Copy from here.
     Platforms   Tilemap, Platformer, Rope
     Swarm       World, FlowField, Sprite, Darkness, music, sound panning
     Workshop    Interact (prompts, hold, carry, throw), A* route finding,
                 FSM, Events, Routines and the choice cards
   -------------------------------------------------------------------------- */
(() => {
const { T, FS, G, U, Sfx, W, H } = Couch;
const pulse = (k, hz = 6) => Math.floor(k.time * hz) % 2 === 0;       // lets a bot "tap" a button

// ===== Room 1: Platforms =====================================================
class Platforms {
  constructor(k) {
    this.k = k; this.name = 'Platforms';
    this.map = new k.Tilemap({ size: 64, solid: '#', rows: [
      '##############################',
      '#............................#',
      '#.............*..............#',
      '#...........#####............#',
      '#.....*................*.....#',
      '#....####............####....#',
      '#............................#',
      '#..........*......*..........#',
      '#........####....####........#',
      '#............................#',
      '#...*....................*...#',
      '#..####................####..#',
      '#............*...............#',
      '#..........######............#',
      '#..S.S.......................#',
      '##############################'] });
    this.stars = this.map.find('*').map(s => ({ x: s.x, y: s.y, got: false }));
    const spawn = this.map.find('S');
    this.ps = k.players.map((seat, n) => Object.assign(new k.Platformer({ x: spawn[n % spawn.length].x, y: spawn[n % spawn.length].y, jump: 1150 }), { seat, i: seat.index, anchor: false }));
    this.rope = this.ps.length > 1 ? new k.Rope({ length: 440 }) : null;
    this.fx = new k.Particles(300); this.got = 0;
    this.hints = [['move', 'Run'], ['a', 'Jump'], ['lt', 'Anchor'], ['rt', 'Reel in']];
  }
  update(dt) {
    const k = this.k, map = this.map;
    for (const p of this.ps) {
      const s = p.seat; p.anchor = s.value('lt') > 0.5 && p.ground;
      p.update(dt, map, { move: p.anchor ? 0 : s.move.x, jump: s.down('a'), jumpPressed: s.pressed('a') && !p.anchor });
      if (p.jumped) { Sfx.play('tick', { pitch: 0.7 }); this.fx.burst(p.x, p.y + p.h / 2, 6, { color: T.muted, angle: Math.PI / 2, spread: 2, speed: [40, 200], life: 0.3, size: 6 }); }
      if (p.landed) this.fx.burst(p.x, p.y + p.h / 2, 5, { color: T.muted, angle: -Math.PI / 2, spread: 2.6, speed: [40, 160], life: 0.25, size: 5 });
    }
    if (this.rope) {
      const [a, b] = this.ps, reel = a.seat.value('rt') > 0.3 || b.seat.value('rt') > 0.3;
      this.rope.length = U.approach(this.rope.length, reel ? 150 : 440, (reel ? 320 : 500) * dt);
      const share = a.anchor && !b.anchor ? 0 : b.anchor && !a.anchor ? 1 : 0.5;   // an anchored player does not budge
      this.rope.constrain(a, b, share, map); this.rope.update(dt, a, b, map);
    }
    for (const st of this.stars) {
      if (st.got || !this.ps.some(p => U.dist(p.x, p.y, st.x, st.y) < 52)) continue;
      st.got = true; this.got++; Sfx.play('pickup', { pitch: 1 + this.got * 0.08 });
      this.fx.burst(st.x, st.y, 16, { color: T.good, speed: [80, 360], life: 0.5 });
      if (this.got === this.stars.length) { k.toast('All ' + this.got + ' stars'); Sfx.play('win'); }
    }
    this.fx.update(dt);
  }
  bot(seat, ctl) {                                           // follows the other player, jumps when they are higher
    const me = this.ps.find(p => p.seat === seat), lead = this.ps.find(p => p !== me); if (!lead) return;
    const dx = lead.x - me.x; if (Math.abs(dx) > 110) ctl.x = Math.sign(dx);
    ctl.set('a', lead.y < me.y - 70 && pulse(this.k, 3));
  }
  draw() {
    const k = this.k, c = k.c;
    c.save(); c.translate(0, 28);
    this.map.draw(c);
    for (const st of this.stars) if (!st.got) { k.Shapes.star(c, st.x, st.y, 20); c.fillStyle = T.good; c.fill(); }
    if (this.rope) this.rope.draw(c, this.rope.stretch > 1 ? T.text : T.muted, 5);
    for (const p of this.ps) {
      G.rrect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 12, T.p[p.i]);
      G.marker(p.i, p.x, p.y + 6, 9, { color: T.bg });
      G.circle(p.x + p.face * 9, p.y - 14, 5, T.bg);
      if (p.anchor) G.rrect(p.x - p.w / 2 - 8, p.y + p.h / 2 - 6, p.w + 16, 6, 3, T.text);
    }
    this.fx.draw(c);
    c.restore();
    this.stat = this.got + ' / ' + this.stars.length + ' stars';
  }
}

// ===== Room 2: Swarm ===========================================================
const SONG = { bpm: 112, root: 55, tracks: [
  { wave: 'triangle', oct: 1, vol: 0.11, len: 1.6, notes: [0, null, null, 0, null, null, 0, null, 3, null, null, 3, null, null, 5, null] },
  { wave: 'noise', vol: 0.03, len: 0.03, freq: 8000, at: 0.15, notes: [1, null, 1, null, 1, null, 1, null, 1, null, 1, null, 1, null, 1, 1] },
  { wave: 'square', oct: 3, vol: 0.028, len: 0.8, at: 0.4, notes: [0, null, 7, null, 3, null, 7, null, 0, null, 7, null, 5, null, 10, null] },
  { wave: 'sawtooth', oct: 2, vol: 0.03, len: 3.5, at: 0.75, notes: [0, null, null, null, null, null, null, null, 3, null, null, null, 5, null, null, null] },
] };
class Swarm {
  constructor(k) {
    this.k = k; this.name = 'Swarm';
    const rows = [];
    for (let y = 0; y < 18; y++) { let s = ''; for (let x = 0; x < 32; x++) s += x === 0 || y === 0 || x === 31 || y === 17 || ((x % 7 === 4 || x % 7 === 5) && y % 5 === 3) ? '#' : '.'; rows.push(s); }
    const map = this.map = new k.Tilemap({ size: 80, rows, solid: '#' });
    const world = this.world = new k.World({ w: map.w, h: map.h, cell: 96, map });
    const flow = this.flow = new k.FlowField(map);
    this.cam = new k.Camera({ minZoom: 0.62, maxZoom: 1, margin: 360, bounds: { x: 0, y: 0, w: map.w, h: map.h } });
    this.fx = new k.Particles(1500); this.dark = new k.Darkness({ ambient: 0.9 }); this.lights = true; this.ft = 0; this.n = 0; this.shown = 0;   // lights: true = the room is dark
    // One drawing, turned to 32 angles once, then stamped for every bug. This is what keeps thousands of them cheap.
    const spr = k.Sprite.bake(40, 40, c => { k.Shapes.arrow(c, 0, 0, 0, 16); c.fillStyle = 'rgba(240,97,109,0.28)'; c.fill(); c.strokeStyle = T.bad; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke(); }).spin(32);
    this.drawBug = (c, e) => spr.draw(c, e.x, e.y, e.a);
    this.bugUpdate = function (dt) {
      const d = flow.dir(this.x, this.y);
      this.x += (d.x * this.sp + this.kx) * dt; this.y += (d.y * this.sp + this.ky) * dt;
      const kd = Math.max(0, 1 - 5 * dt); this.kx *= kd; this.ky *= kd;
      map.collideCircle(this); if (d.x || d.y) this.a = Math.atan2(d.y, d.x);
    };
    const drawPlayer = (c, p) => {
      if (p.pulse > 0) G.circle(p.x, p.y, 300 * (1 - p.pulse / 0.35), null, T.p[p.i], 6 * (p.pulse / 0.35));
      G.marker(p.i, p.x, p.y, p.r); G.circle(p.x + p.fx * (p.r - 12), p.y + p.fy * (p.r - 12), 7, T.bg);
      if (p.cd > 0) G.ring(p.x, p.y, p.r + 12, 1 - p.cd / 0.7, T.p[p.i], 4);
    };
    this.ps = k.players.map((seat, n) => world.add({ tag: 'player', layer: 1, seat, i: seat.index, x: map.w / 2 + (k.players.length > 1 ? (n ? 80 : -80) : 0), y: map.h / 2, r: 34, vx: 0, vy: 0, fx: 1, fy: 0, cd: 0, pulse: 0, draw: drawPlayer }));
    flow.compute(this.ps); this.spawn(300);
  }
  spawn(count) {
    const k = this.k, map = this.map; let made = 0, tries = 0;
    while (made < count && tries++ < count * 20) {
      const x = U.range(k.rng, 100, map.w - 100), y = U.range(k.rng, 100, map.h - 100);
      if (map.solidAt(x, y) || this.ps.some(p => U.dist(p.x, p.y, x, y) < 520)) continue;
      this.world.add({ tag: 'bug', x, y, r: 14, sp: U.range(k.rng, 140, 215), a: 0, kx: 0, ky: 0, update: this.bugUpdate, draw: this.drawBug }); made++;
    }
    this.n += made;
  }
  enter() { Sfx.music.play(SONG); }
  update(dt) {
    const k = this.k, world = this.world;
    for (const p of this.ps) {
      const s = p.seat; p.cd -= dt; p.pulse -= dt;
      if (s.move.x || s.move.y) { const m = Math.hypot(s.move.x, s.move.y); p.fx = s.move.x / m; p.fy = s.move.y / m; }
      p.vx = U.damp(p.vx, s.move.x * 480, 14, dt); p.vy = U.damp(p.vy, s.move.y * 480, 14, dt);
      world.move(p, p.vx * dt, p.vy * dt);
      if (s.pressed('a') && p.cd <= 0) {                     // pulse: everything close gets thrown back
        p.cd = 0.7; p.pulse = 0.35; let hit = 0;
        world.near(p.x, p.y, 300, 'bug', e => { const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1; e.kx = (dx / d) * 950; e.ky = (dy / d) * 950; hit++; });
        k.sfxAt('dash', p.x, this.cam); if (hit) { k.shake(0.3); s.rumble(0.5, 110); }
        this.fx.burst(p.x, p.y, 28, { color: T.p[p.i], speed: [300, 800], life: 0.35, size: 7 });
      }
      if (s.pressed('x')) { if (this.n < 3000) { this.spawn(200); k.toast(this.n + ' bugs'); } else k.toast('That is plenty'); }
      if (s.pressed('y')) { this.lights = !this.lights; k.toast(this.lights ? 'Lights off' : 'Lights on'); }
    }
    if ((this.ft -= dt) <= 0) { this.flow.compute(this.ps); this.ft = 0.2; }   // one search serves every bug
    world.separate('bug', 0.6); world.update(dt);              // separate first, so each bug's own wall check has the last word
    for (const p of this.ps) world.near(p.x, p.y, p.r, 'bug', e => { const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1, m = p.r + e.r; if (d < m) { e.x = p.x + (dx / d) * m; e.y = p.y + (dy / d) * m; } });
    this.cam.follow(this.ps, dt); this.fx.update(dt);
    k.watch.bugs = this.n; k.watch.drawn = this.shown; Sfx.music.intensity = U.clamp(this.n / 1200, 0, 1);
  }
  bot(seat, ctl) {                                           // stays near the other player, pulses when crowded
    const me = this.ps.find(p => p.seat === seat), lead = this.ps.find(p => p !== me);
    if (lead) { const dx = lead.x - me.x, dy = lead.y - me.y, d = Math.hypot(dx, dy); if (d > 240) { ctl.x = dx / d; ctl.y = dy / d; } }
    let n = 0; this.world.near(me.x, me.y, 220, 'bug', () => n++); ctl.set('a', n > 8 && me.cd <= 0);
  }
  draw() {
    const k = this.k, c = k.c, cam = this.cam, v = cam.view();
    cam.begin(c); this.map.draw(c, v); this.shown = this.world.draw(c, v); this.fx.draw(c); cam.end(c);
    if (this.lights) {
      const d = this.dark; d.begin();
      for (const p of this.ps) {
        const s = cam.toScreen(p.x, p.y);
        d.light(s.x, s.y, 300 * cam.zoom); d.cone(s.x, s.y, Math.atan2(p.fy, p.fx), 1.1, 950 * cam.zoom, 0.95);
        if (p.pulse > 0) d.light(s.x, s.y, 720 * cam.zoom, p.pulse / 0.35);
      }
      d.end(c);
    }
    this.hints = [['move', 'Move'], ['a', 'Pulse'], ['x', '200 more'], ['y', 'Lights']];
    this.stat = this.n + ' bugs';
  }
}

// ===== Room 3: Workshop ==========================================================
class Workshop {
  constructor(k) {
    this.k = k; this.name = 'Workshop'; const self = this;
    const world = this.world = new k.World({ walls: [{ x: 0, y: 0, w: W, h: 140 }, { x: 880, y: 360, w: 160, h: 400 }] });
    this.grid = k.Path.grid(W, H, 60, world.walls, 38);      // walls, widened by a body's radius
    this.act = new k.Interact(); this.items = []; this.fx = new k.Particles(400);
    this.packer = { x: 1500, y: 420, r: 110 }; this.chute = { x: 1500, y: 820, r: 110 };
    this.delivered = 0; this.mods = { speed: 1, throw: 1, pack: 1 }; this.perks = []; this.turn = 0;
    this.ps = k.players.map((seat, n) => ({ seat, i: seat.index, x: 320, y: 460 + n * 200, r: 34, vx: 0, vy: 0, fx: 1, fy: 0, carry: null }));
    this.station = this.act.add({ x: this.packer.x, y: this.packer.y, r: 150, btn: 'x', hold: 1.1, label: 'Hold to pack', lift: 170,
      can: a => !!a.carry && !a.carry.packed,
      use: a => { a.carry.packed = true; Sfx.play('ready'); a.seat.rumble(0.5, 120); this.fx.burst(a.carry.x, a.carry.y, 14, { color: T.good, speed: [80, 320], life: 0.4 }); } });
    for (let i = 0; i < 4; i++) this.crate();
    k.on('delivered', () => { this.delivered++; if (this.delivered % 3 === 0) this.perk(); });
    // The courier: a state machine that plans a route with A*, walks it, then plans again.
    const cour = this.cour = { x: 1720, y: 240, r: 20, path: null, at: 0 };
    cour.fsm = new k.FSM({
      think: { update(dt, f) { if (f.time < 0.4) return; const lead = self.ps[0], s = self.grid.size; cour.path = k.Path.astar(self.grid, Math.floor(cour.x / s), Math.floor(cour.y / s), Math.floor(lead.x / s), Math.floor(lead.y / s)); cour.at = 1; f.go(cour.path && cour.path.length > 2 ? 'walk' : 'think'); } },
      walk: { update(dt, f) {
        const n = cour.path[cour.at]; if (!n || f.time > 1.2 || cour.path.length - cour.at < 3) { f.go('think'); return; }
        const dx = n.x - cour.x, dy = n.y - cour.y, d = Math.hypot(dx, dy);
        if (d < 8) cour.at++; else { cour.x += (dx / d) * 260 * dt; cour.y += (dy / d) * 260 * dt; }
      } },
    }, 'think');
    this.hints = [['a', 'Pick up or drop'], ['b', 'Throw'], ['x', 'Pack']];
  }
  crate() {
    const k = this.k, it = { x: U.range(k.rng, 140, 760), y: U.range(k.rng, 240, 980), r: 26, vx: 0, vy: 0, packed: false, held: null };
    it.act = this.act.add({ x: it.x, y: it.y, r: 86, label: 'Pick up', lift: 70, can: a => !a.carry && !it.held,
      use: a => { this.act.hold(a, it); a.picked = true; Sfx.play('tick'); } });
    this.items.push(it);
  }
  perk() {                                                   // a script: wait, ask, apply
    const k = this.k, self = this, who = k.players[this.turn++ % k.players.length].index;
    const icon = draw => (c, x, y, s, sel) => { c.strokeStyle = sel ? T.text : T.muted; c.fillStyle = sel ? T.text : T.muted; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round'; draw(c, x, y, s); c.lineCap = 'butt'; c.lineJoin = 'miter'; };
    const opts = [
      { title: 'Quick feet', tag: 'Movement', text: 'Both of you move a quarter faster.', apply: () => { self.mods.speed *= 1.25; },
        icon: icon((c, x, y, s) => { for (const o of [-22, 0, 22]) { c.beginPath(); c.moveTo(x + o - 14, y - s * 0.5); c.lineTo(x + o + 14, y); c.lineTo(x + o - 14, y + s * 0.5); c.stroke(); } }) },
      { title: 'Strong arm', tag: 'Throwing', text: 'Thrown crates travel much further.', apply: () => { self.mods.throw *= 1.4; },
        icon: icon((c, x, y, s) => { c.beginPath(); c.arc(x, y + s * 0.5, s, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); k.Shapes.arrow(c, x + s * 0.88, y + s * 0.06, 0.9, 16); c.fill(); }) },
      { title: 'Fast hands', tag: 'Packing', text: 'The packer takes a third less time.', apply: () => { self.mods.pack *= 0.66; },
        icon: icon((c, x, y, s) => { c.beginPath(); c.arc(x, y, s * 0.72, 0, Math.PI * 2); c.stroke(); c.beginPath(); c.moveTo(x, y - s * 0.4); c.lineTo(x, y); c.lineTo(x + s * 0.3, y + s * 0.16); c.stroke(); }) },
    ];
    k.run(function* () {
      yield 0.5;
      const i = yield k.choose({ title: self.delivered + ' delivered. Pick a perk.', by: who, options: opts });
      opts[i].apply(); self.perks.push(opts[i].title); k.toast(opts[i].title, { seat: who });
    });
  }
  update(dt) {
    const k = this.k, world = this.world, act = this.act;
    this.station.hold = 1.1 * this.mods.pack;
    for (const p of this.ps) {
      const s = p.seat, sp = 430 * this.mods.speed; p.picked = false;
      if (s.move.x || s.move.y) { const m = Math.hypot(s.move.x, s.move.y); p.fx = s.move.x / m; p.fy = s.move.y / m; }
      p.vx = U.damp(p.vx, s.move.x * sp, 16, dt); p.vy = U.damp(p.vy, s.move.y * sp, 16, dt);
      world.move(p, p.vx * dt, p.vy * dt);
    }
    act.update(dt, this.ps);
    for (const p of this.ps) {
      const s = p.seat; if (!p.carry || p.picked) continue;
      if (s.pressed('a')) { act.release(p, p.fx * 70, p.fy * 70); Sfx.play('tick', { pitch: 0.8 }); }
      else if (s.pressed('b')) { act.release(p, p.fx * 1150 * this.mods.throw, p.fy * 1150 * this.mods.throw); Sfx.play('dash'); s.rumble(0.3, 80); }
    }
    act.updateItems(dt, this.items, world);
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i]; it.act.x = it.x; it.act.y = it.y;
      if (it.packed && !it.held && U.dist(it.x, it.y, this.chute.x, this.chute.y) < this.chute.r - 12) {
        this.items.splice(i, 1); act.remove(it.act); Sfx.play('revive');
        this.fx.burst(it.x, it.y, 24, { color: T.good, speed: [100, 420], life: 0.5 });
        k.emit('delivered'); this.crate();
      }
    }
    this.cour.fsm.update(dt); this.fx.update(dt);
  }
  bot(seat, ctl) {                                           // fetch, pack, deliver; walks round the counter with A*
    const k = this.k, me = this.ps.find(p => p.seat === seat), s = this.grid.size; let goal = null, near = 30;
    if (!me.carry) {
      let bd = Infinity; for (const it of this.items) { if (it.held) continue; const d = U.dist2(me.x, me.y, it.x, it.y); if (d < bd) { bd = d; goal = it; } }
      if (goal && me.focus === goal.act) ctl.set('a', pulse(k));
    } else if (!me.carry.packed) { goal = this.packer; near = 110; if (U.dist(me.x, me.y, goal.x, goal.y) < 130) ctl.set('x', true); }
    else { goal = this.chute; near = 50; if (U.dist(me.x, me.y, goal.x, goal.y) < 60) ctl.set('a', pulse(k)); }
    if (!goal) return;
    let tx = goal.x, ty = goal.y;
    const path = k.Path.astar(this.grid, Math.floor(me.x / s), Math.floor(me.y / s), Math.floor(goal.x / s), Math.floor(goal.y / s));
    if (path && path.length > 2) { tx = path[1].x; ty = path[1].y; near = 0; }
    const dx = tx - me.x, dy = ty - me.y, d = Math.hypot(dx, dy); if (d > near) { ctl.x = dx / d; ctl.y = dy / d; }
  }
  draw() {
    const k = this.k, c = k.c, pk = this.packer, ch = this.chute, cr = this.cour;
    c.fillStyle = 'rgba(255,255,255,0.05)'; for (let x = 60; x < W; x += 120) for (let y = 200; y < H; y += 120) c.fillRect(x - 2, y - 2, 4, 4);
    const w = this.world.walls[1]; G.rrect(w.x, w.y, w.w, w.h, 14, T.s2, T.line2); G.eyebrow('Counter', w.x + w.w / 2, w.y + w.h / 2, { align: 'center', color: T.faint, base: 'middle' });
    G.circle(pk.x, pk.y, pk.r, T.s1, T.line2, 4); G.circle(pk.x, pk.y, pk.r - 24, null, T.line2, 2); G.eyebrow('Packer', pk.x, pk.y + 8, { align: 'center' });
    c.save(); c.setLineDash([18, 12]); G.circle(ch.x, ch.y, ch.r, 'rgba(46,189,133,0.08)', T.good, 4); c.restore(); G.eyebrow('Chute', ch.x, ch.y + 8, { align: 'center', color: T.good });
    if (cr.path) { c.save(); c.setLineDash([4, 14]); c.beginPath(); c.moveTo(cr.x, cr.y); for (let i = cr.at; i < cr.path.length; i++) c.lineTo(cr.path[i].x, cr.path[i].y); c.strokeStyle = T.faint; c.lineWidth = 3; c.stroke(); c.restore(); }
    k.Shapes.poly(c, cr.x, cr.y, cr.r, 6, k.time); c.fillStyle = T.s3; c.fill(); c.strokeStyle = T.muted; c.lineWidth = 3; c.stroke();
    G.text('Courier', cr.x, cr.y + 52, { size: FS.xs, color: T.faint, align: 'center' });
    for (const it of this.items) {
      G.rrect(it.x - 24, it.y - 24, 48, 48, 8, it.packed ? 'rgba(46,189,133,0.2)' : T.s3, it.packed ? T.good : T.muted, 3);
      if (it.packed) G.tick(it.x, it.y, 9, T.good); else { G.line(it.x - 24, it.y, it.x + 24, it.y, T.muted, 2); }
    }
    for (const p of this.ps) {
      G.marker(p.i, p.x, p.y, p.r); G.circle(p.x + p.fx * (p.r - 12), p.y + p.fy * (p.r - 12), 7, T.bg);
      G.text('P' + (p.i + 1), p.x, p.y + p.r + 40, { size: FS.xs, weight: 700, color: T.p[p.i], align: 'center' });
    }
    this.fx.draw(c);
    this.act.draw(null, this.ps);
    if (this.perks.length) G.text('Perks: ' + this.perks.join(', '), W - 60, 1042, { size: FS.xs, color: T.muted, align: 'right', base: 'middle' });
    this.stat = this.delivered + ' delivered';
  }
}

// ===== The lab itself: three rooms, LB and RB to move between them =================
class Lab {
  constructor(k) { this.k = k; this.rooms = [new Platforms(k), new Swarm(k), new Workshop(k)]; this.i = 0; }
  go(d) { this.i = (this.i + d + this.rooms.length) % this.rooms.length; Sfx.music.stop(); const r = this.rooms[this.i]; if (r.enter) r.enter(); Sfx.play('select'); }
  update(dt) {
    for (const s of this.k.players) { if (s.bot) continue; const d = (s.pressed('rb') ? 1 : 0) - (s.pressed('lb') ? 1 : 0); if (d) { this.go(d); break; } }
    this.rooms[this.i].update(dt);
  }
  bot(seat, ctl) { const r = this.rooms[this.i]; if (r.bot) r.bot(seat, ctl); }
  draw() {
    const r = this.rooms[this.i], human = this.k.players.find(s => !s.bot) || this.k.players[0], names = human.device.names;
    r.draw();
    let x = 40;
    const tw = this.rooms.reduce((a, q) => a + G.measure(q.name, { size: FS.xs, weight: 500 }) + 56, 0) + 8;
    G.panel(x, 40, tw, 64, 32); x += 8;
    this.rooms.forEach((q, n) => {
      const w = G.measure(q.name, { size: FS.xs, weight: 500 }) + 48, on = n === this.i;
      if (on) G.rrect(x, 48, w, 48, 24, T.s3, T.text, 2);
      G.text(q.name, x + w / 2, 73, { size: FS.xs, weight: 500, color: on ? T.text : T.muted, align: 'center', base: 'middle' }); x += w + 8;
    });
    const hx = 40 + tw + 24 + G.glyph(human.type, 'lb', 40 + tw + 24, 72, 36, { names }) + 8;
    G.hints(hx, 72, [['rb', 'Change room']], human.type, { names });
    if (r.stat) { const w = G.measure(r.stat, { size: FS.sm, mono: true }) + 56; G.panel(W - 40 - w, 40, w, 64, 32); G.text(r.stat, W - 40 - w / 2, 73, { size: FS.sm, mono: true, align: 'center', base: 'middle' }); }
    if (r.hints) G.hints(60, 1042, r.hints, human.type, { names });
  }
}

Couch.register({
  id: 'engine-lab', title: 'Engine Lab', line: 'Three rooms that show what the engine can do.',
  players: 1, bots: true,
  how: ['Platforms: jump, anchor and reel on a rope.', 'Swarm: hundreds of chasers, lights and layered music.', 'Workshop: carry, pack and throw crates, then pick a perk.'],
  controls: [['lb', 'Previous room'], ['rb', 'Next room'], ['a', 'Jump, pulse or pick up'], ['start', 'Pause, then quit']],
  create: k => new Lab(k),
});
})();

    this.rings.push({ x: e.x, y: e.y, max: 900, t: 0, life: 0.8, col: T.text });
    let n = 0; this.world.each('enemy', q => { this.world.remove(q); if (n++ < 160) this.fx.burst(q.x, q.y, 3, { color: FOES[q.type].col, speed: [60, 240], life: 0.4 }); });
    this.ebul.length = 0;
    k.toast('The Mother is dead', { color: T.good, time: 3 });
    k.after(2.2, () => k.finish({ won: true, score: this.t, title: 'Night survived', note: 'The Mother is dead.', stats: this.stats(true) }));
  }

  // ---- Practice bot. Also drives Couch.simulate for balance runs. --------------------------------------------
  bot(seat, ctl) {                                           // scores 16 directions: danger, walls, goal, spacing
    const p = this.byIdx[seat.index]; if (!p || p.down || this.over) return;
    const mate = this.ps.find(q => q !== p), map = this.map, foes = [], B = this.boss;
    this.world.near(p.x, p.y, 460, null, e => { if (e.foe) foes.push(e); });
    let gx = 0, gy = 0, gw = 0;
    if (mate && mate.down) {
      gx = mate.x - p.x; gy = mate.y - p.y; const d = Math.hypot(gx, gy);
      if (d < 95) { ctl.x = ctl.y = 0; return; }             // stand still beside them until they are up
      gw = 7;
    }
    else {
      let gd = 640 * 640; this.world.near(p.x, p.y, 640, 'gem', g => { const d = U.dist2(p.x, p.y, g.x, g.y); if (d < gd) { gd = d; gx = g.x - p.x; gy = g.y - p.y; gw = g.kind === 'xp' ? 1.2 : 3; } });
      if (mate) { const dx = mate.x - p.x, dy = mate.y - p.y, d = Math.hypot(dx, dy); if (d > 520) { gx = dx; gy = dy; gw = Math.min(3, (d - 520) / 200 + 1); } }
      if (!gw) { gx = map.w / 2 - p.x; gy = map.h / 2 - p.y; gw = 0.3; }
    }
    const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
    let best = -Infinity, bx = 0, by = 0;
    for (let i = 0; i < 16; i++) {
      const dx = Math.cos((i / 16) * TAU), dy = Math.sin((i / 16) * TAU); let score = (dx * gx + dy * gy) * gw;
      for (const [step, wall] of [[70, 60], [160, 12]]) {
        const x = p.x + dx * step, y = p.y + dy * step;
        if (map.solidAt(x, y) || map.solidAt(x + dy * 26, y - dx * 26) || map.solidAt(x - dy * 26, y + dx * 26)) score -= wall;
        for (const e of foes) {
          const d = Math.hypot(e.x - x, e.y - y) - e.r - p.r, w = e.tag === 'boss' ? 5 : e.elite ? 3 : e.type === 'bomber' && e.st === 1 ? 6 : 1;
          score -= w * (60 / Math.max(8, d + 40) + (d < 40 ? 4 : 0));
        }
        for (const b of this.ebul) for (const f of [0.15, 0.4]) { const d = Math.hypot(b.x + b.vx * f - x, b.y + b.vy * f - y) - b.r - p.r; if (d < 120) score -= 50 / Math.max(10, d + 20) + (d < 20 ? 6 : 0); }
        if (B && (B.st === 'aim' || B.st === 'charge')) {
          const t = U.clamp((x - B.x) * B.cdx + (y - B.y) * B.cdy, 0, 1400), d = Math.hypot(B.x + B.cdx * t - x, B.y + B.cdy * t - y);
          if (d < B.r + 90) score -= 8;
        }
      }
      if (mate && !mate.down) { const mx = mate.x - p.x, my = mate.y - p.y, md = Math.hypot(mx, my); if (md < 150 && md > 0) score -= ((dx * mx + dy * my) / md) * 0.8; }
      if (score > best) { best = score; bx = dx; by = dy; }
    }
    ctl.x = bx; ctl.y = by;
  }
  dev(code) {
    if (code === 'F7' && !this.boss) { this.t = Math.min(BOSS_AT, this.t + 60); this.eventT = Math.max(this.eventT, Math.ceil(this.t / 60) * 60); this.k.toast('Skipped to ' + clock(this.t)); }
    if (code === 'F8') this.gainXp(this.need() - this.xp);
  }

  // ---- Drawing -------------------------------------------------------------------------------------------------
  draw() {
    const k = this.k, c = k.c, cam = this.cam, v = cam.view();
    cam.begin(c);
    this.map.draw(c, v);
    for (const s of this.shells) {                            // where each shell will land
      const f = s.t / s.fl; c.globalAlpha = 0.25 + f * 0.4; c.setLineDash([10, 10]); G.circle(s.tx, s.ty, s.rad * (0.4 + 0.6 * f), null, s.col, 3); c.setLineDash([]); c.globalAlpha = 1;
    }
    for (const w of this.wells) { c.globalAlpha = 0.35; G.circle(w.x, w.y, w.rad * (1 - w.t / w.dur), null, w.s.col, 4); c.globalAlpha = 1; }
    if (this.wireOn) {
      const [a, b] = this.alive; c.globalAlpha = 0.35; G.line(a.x, a.y, b.x, b.y, ICE, 14); c.globalAlpha = 1;
      c.beginPath(); c.moveTo(a.x, a.y); for (let i = 1; i < 12; i++) { const f = i / 12; c.lineTo(U.lerp(a.x, b.x, f) + (Math.random() - 0.5) * 18, U.lerp(a.y, b.y, f) + (Math.random() - 0.5) * 18); } c.lineTo(b.x, b.y);
      c.strokeStyle = '#FFFFFF'; c.lineWidth = 3; c.stroke();
    } else if (this.backOn) { c.globalAlpha = 0.4; c.setLineDash([6, 12]); G.line(this.alive[0].x, this.alive[0].y, this.alive[1].x, this.alive[1].y, T.text, 3); c.setLineDash([]); c.globalAlpha = 1; }
    else if (this.taut) { c.globalAlpha = 0.3; G.line(this.ps[0].x, this.ps[0].y, this.ps[1].x, this.ps[1].y, T.muted, 2); c.globalAlpha = 1; }
    this.world.draw(c, v);
    for (const s of this.shots) {
      const col = s.kind === 'shard' ? ICE : T.p[s.owner], f = s.kind === 'shard' ? 0.016 : 0.024;
      G.line(s.x - s.vx * f, s.y - s.vy * f, s.x, s.y, col, s.kind === 'shard' ? 5 : 6);
    }
    for (const p of this.ps) {
      if (p.down) {
        G.marker(p.i, p.x, p.y, p.r, { hollow: true, lw: 4 });
        G.ring(p.x, p.y, p.r + 24, 1, T.s3, 9); G.ring(p.x, p.y, p.r + 24, p.revive, T.p[p.i], 9);
        G.text('Down', p.x, p.y - p.r - 52, { size: FS.sm, weight: 700, color: T.bad, align: 'center' });
        continue;
      }
      for (const w of p.weapons) if (w.id === 'orbit') {
        const st = WEAPONS.orbit.stat(w.lvl), rad = st.rad * p.area;
        for (let j = 0; j < st.n; j++) { const a = w.a + (j / st.n) * TAU; c.save(); c.translate(p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad); c.rotate(a + Math.PI / 2); G.rrect(-18, -6, 36, 12, 6, T.p[p.i]); c.restore(); }
      }
      if (p.iframe > 0 && Math.floor(p.iframe * 14) % 2) c.globalAlpha = 0.45;
      G.marker(p.i, p.x, p.y, p.r, { color: p.hurtT > 0 ? '#FFFFFF' : T.p[p.i] }); c.globalAlpha = 1;
      G.circle(p.x + p.fx * (p.r - 12), p.y + p.fy * (p.r - 12), 7, T.bg);
      if (p.hp < p.maxHp) G.bar(p.x - 40, p.y + p.r + 18, 80, 8, p.hp / p.maxHp, p.hp < p.maxHp * 0.35 ? T.bad : T.p[p.i]);
    }
    this.fx.draw(c);
    cam.end(c);

    // Night: light around each of you, and around the brightest things
    const d = this.dark, z = cam.zoom; d.begin();
    const m = this.mid(), ms = cam.toScreen(m.x, m.y); d.light(ms.x, ms.y, 1300 * z, 0.35);
    for (const p of this.ps) { const s = cam.toScreen(p.x, p.y); d.light(s.x, s.y, (p.down ? 380 : 640) * z); }
    if (this.boss && this.boss.alive) { const s = cam.toScreen(this.boss.x, this.boss.y); d.light(s.x, s.y, 360 * z, 0.6); }
    for (const b of this.booms) { const s = cam.toScreen(b.x, b.y); d.light(s.x, s.y, b.rad * 2 * z, 1 - b.t / b.life); }
    d.end(c);

    // On top of the dark: things you must always see
    cam.begin(c);
    for (const b of this.ebul) { G.circle(b.x, b.y, b.r, 'rgba(240,97,109,0.35)', T.bad, 3); G.circle(b.x, b.y, b.r * 0.4, '#FFFFFF'); }
    const B = this.boss;
    if (B && B.alive && B.st === 'aim') {
      const L = 1300, a = 0.25 + 0.35 * (Math.floor(B.stT * 12) % 2);
      c.globalAlpha = 0.12; G.line(B.x, B.y, B.x + B.cdx * L, B.y + B.cdy * L, T.bad, B.r * 2); c.globalAlpha = a;
      c.setLineDash([24, 16]); G.line(B.x, B.y, B.x + B.cdx * L, B.y + B.cdy * L, T.bad, 5); c.setLineDash([]); c.globalAlpha = 1;
    }
    for (const s of this.shells) { const f = s.t / s.fl, x = U.lerp(s.x0, s.tx, f), y = U.lerp(s.y0, s.ty, f) - Math.sin(Math.PI * f) * 240; G.circle(x, y, 10, s.col, T.bg, 3); }
    for (const r of this.rings) { const f = r.t / r.life; c.globalAlpha = 1 - f; G.circle(r.x, r.y, r.max * U.easeOut(f), null, r.col, 7); c.globalAlpha = 1; }
    for (const b of this.booms) { const f = b.t / b.life; c.globalAlpha = (1 - f) * 0.35; G.circle(b.x, b.y, b.rad * (0.6 + 0.4 * f), b.col); c.globalAlpha = 1 - f; G.circle(b.x, b.y, b.rad * (0.6 + 0.4 * f), null, b.col, 4); c.globalAlpha = 1; }
    for (const zp of this.zaps) {
      const P = zp.pts; c.globalAlpha = 1 - zp.t / zp.life;
      for (const [col, lw] of [[zp.col, 12], ['#FFFFFF', 3]]) { c.beginPath(); c.moveTo(P[0], P[1]); for (let i = 2; i < P.length; i += 2) c.lineTo(P[i] + (Math.random() - 0.5) * 10, P[i + 1] + (Math.random() - 0.5) * 10); c.strokeStyle = col; c.lineWidth = lw; c.globalAlpha *= lw > 6 ? 0.45 : 1; c.stroke(); c.globalAlpha = 1 - zp.t / zp.life; }
      c.globalAlpha = 1;
    }
    cam.end(c);
    this.hud();
  }

  hud() {
    const k = this.k, c = k.c;
    // shared gems bar along the top
    G.bar(40, 22, W - 80, 10, this.xp / this.need(), T.good);
    G.panel(40, 48, 220, 72);
    G.eyebrow('Level', 64, 92);
    G.text(String(this.level), 236, 98, { size: FS.md, weight: 500, mono: true, align: 'right' });
    const kills = this.kills.toLocaleString('en-AU'), kw = Math.max(240, G.measure(kills, { size: FS.md, mono: true }) + 150);
    G.panel(W - 40 - kw, 48, kw, 72);
    G.eyebrow('Cleared', W - 40 - kw + 24, 92);
    G.text(kills, W - 64, 98, { size: FS.md, weight: 500, mono: true, align: 'right' });
    const B = this.boss;
    if (B) {
      const w = 900, x = (W - w) / 2, f = Math.max(0, B.hp / B.max);
      G.panel(x, 48, w, 72);
      G.eyebrow('The Mother', x + 24, 92, { color: T.bad });
      G.bar(x + 210, 78, w - 340, 14, f, T.bad);
      G.text(Math.ceil(f * 100) + '%', x + w - 24, 92, { size: FS.sm, mono: true, align: 'right' });
    } else {
      const w = 320, x = (W - w) / 2;
      G.panel(x, 48, w, 72);
      G.eyebrow('Mother in', x + 24, 92);
      G.text(clock(BOSS_AT - this.t), x + w - 24, 98, { size: FS.md, weight: 500, mono: true, align: 'right', color: BOSS_AT - this.t < 30 ? T.bad : T.text });
    }
    // a panel per player, in their corner
    this.ps.forEach((p, n) => {
      const w = 520, h = 112, x = n ? W - 40 - w : 40, y = H - 40 - h, col = T.p[p.i];
      G.panel(x, y, w, h);
      G.marker(p.i, x + 36, y + 34, 12, { hollow: p.down });
      G.eyebrow('Player ' + (p.i + 1), x + 60, y + 41, { color: col });
      if (p.down) {
        G.text('Down', x + 220, y + 41, { size: FS.xs, weight: 700, color: T.bad });
        G.bar(x + 300, y + 30, w - 324, 12, p.revive, col);
      } else {
        G.bar(x + 220, y + 30, w - 390, 12, p.hp / p.maxHp, p.hp < p.maxHp * 0.35 ? T.bad : col);
        G.text(Math.ceil(p.hp) + ' / ' + Math.round(p.maxHp), x + w - 24, y + 42, { size: FS.xs, mono: true, align: 'right', color: T.muted });
      }
      for (let s = 0; s < 4; s++) {
        const wp = p.weapons[s], sx = x + 24 + s * 64, sy = y + 60;
        G.rrect(sx, sy, 52, 40, 8, wp ? T.s2 : null, T.line, 2);
        if (!wp) continue;
        drawIcon(c, wp.id, sx + 26, sy + 17, 22, T.text);
        for (let l = 0; l < 5; l++) G.circle(sx + 12 + l * 7, sy + 33, 2.5, l < wp.lvl ? col : T.s3);
      }
      const bits = [];
      for (const id in p.passives) bits.push(PASSIVES[id].name + ' ' + p.passives[id]);
      if (bits.length) G.wrap(bits.join(' · '), x + 290, y + 78, w - 314, 26, { size: FS.xs, color: T.faint, base: 'middle' }, 2);
    });
    if (this.backOn) G.text('Back to back', W / 2, H - 100, { size: FS.xs, weight: 500, color: T.text, align: 'center', base: 'middle' });
    // arrows at the screen edge for the Mother and big bugs you cannot see yet
    if (B && B.alive) this.cam.indicator(B.x, B.y, T.bad);
    this.world.each('enemy', e => { if (e.elite) this.cam.indicator(e.x, e.y, 'rgba(240,97,109,0.7)'); });
  }
}

Couch.register({
  id: 'swarm-night', players: 2, bots: true, best: 'low', scoreLabel: 'Mother killed at', formatScore: clock,
  line: 'Survive the swarm with shared upgrades.',
  how: ['You only move. Your weapons fire by themselves.', 'Gems are shared. Each level, one of you picks an upgrade. You take turns.',
    'At 10:00 the Mother arrives. Kill her to win. Stand by a downed partner to revive them.'],
  controls: [['move', 'Move'], ['a', 'Pick an upgrade'], ['start', 'Pause']],
  assistText: ['', '40% more health, quicker revives', '80% more health, quickest revives'],
  create: k => new SwarmNight(k),
});
})();
</script>
<script>
/* ==========================================================================
   TANK FOR TWO · slot 10 · Run-based action
   One tank, two seats. The driver steers, boosts and picks up crates. The
   gunner aims, picks a shell, fires and reloads. Ten waves; between waves one
   of you picks an upgrade, and you can swap seats.

   Developer keys while playing: F7 clears the current wave, F8 repairs the hull.
   Balance runs from the console: Couch.simulate('tank-for-two', { seed: 1, step: 1 / 30 })
   ========================================================================== */
(() => {
const { T, FS, G, U, Sfx, W, H } = Couch;
const TILE = 80, TAU = Math.PI * 2, WAVES = 10, ICE = '#BDEBFF', PEACH = '#FFB089';
const clock = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// ---- Sounds this game adds ---------------------------------------------------------------------
Object.assign(Sfx.bank, {
  cannon: (S, o) => { S.noise(0.26, { freq: 320, q: 0.7, vol: 0.3, ...o }); S.tone(95, 0.24, { to: 40, type: 'sawtooth', vol: 0.18, ...o }); },
  mg: (S, o) => S.noise(0.045, { freq: 2600, vol: 0.09, ...o }),
  clang: (S, o) => { S.tone(1250, 0.07, { type: 'square', vol: 0.05, ...o }); S.tone(1850, 0.05, { type: 'square', vol: 0.035, delay: 0.02, ...o }); },
  boom: (S, o) => { S.noise(0.45, { freq: 170, q: 0.6, vol: 0.32, ...o }); S.tone(70, 0.4, { to: 30, type: 'sine', vol: 0.26, ...o }); },
  reload: (S, o) => { S.tone(300, 0.05, { type: 'square', vol: 0.06, ...o }); S.tone(460, 0.06, { type: 'square', vol: 0.06, delay: 0.08, ...o }); },
  perfect: (S, o) => [660, 880, 1320].forEach((f, i) => S.tone(f, 0.08, { delay: i * 0.04, vol: 0.12, ...o })),
  jam: (S, o) => S.tone(110, 0.32, { type: 'square', vol: 0.09, ...o }),
});

// ---- Bugs --------------------------------------------------------------------------------------------
// armour: half-angle of the armoured front, in radians
const FOES = {
  crawler:   { name: 'Crawler',      r: 16, hp: 20,   sp: 195, dmg: 14, col: '#F0616D' },
  spitter:   { name: 'Spitter',      r: 22, hp: 50,   sp: 110, dmg: 12, col: '#B48CF2' },
  shellback: { name: 'Shellback',    r: 34, hp: 170,  sp: 82,  dmg: 16, col: '#D9507E', armour: 1.15, turn: 1.6 },
  hornet:    { name: 'Hornet',       r: 15, hp: 18,   sp: 300, dmg: 12, col: '#F07FA8', fly: true },
  siege:     { name: 'Siege beetle', r: 72, hp: 1800, sp: 58,  dmg: 24, col: '#C04A6A', armour: 1.0, turn: 0.9 },
};
const TIPS = {
  crawler: 'Crawlers burst when they touch you. Shoot them first.',
  spitter: 'Spitters shoot from range. Driver, dodge the shots.',
  shellback: 'Shellbacks are armoured at the front. Flank them, or use HE.',
  hornet: 'Hornets circle, then dive. Flak and the machine gun catch them.',
  siege: 'A Siege beetle. Armoured, it shoots, and it brings friends.',
};
const SHELLS = [
  { id: 'ap', name: 'AP', full: 'Armour-piercing', col: T.text, speed: 1500 },
  { id: 'he', name: 'HE', full: 'Explosive', col: PEACH, speed: 1000 },
  { id: 'flak', name: 'Flak', full: 'Flak', col: ICE, speed: 1300 },
];

// ---- Upgrades: role says whose job it changes ---------------------------------------------------
const UPGRADES = {
  mag:     { name: 'Big magazine', role: 'Gunner', max: 2, prio: 6, text: 'Three more rounds before you reload.', apply: g => { g.tank.magMax += 3; g.tank.mag = g.tank.magMax; } },
  loader:  { name: 'Quick loader', role: 'Gunner', max: 2, prio: 5, text: 'Reloading is 25% faster, and the green zone is wider.', apply: g => { g.st.reload *= 0.75; g.st.window += 0.04; } },
  sabot:   { name: 'Sabot rounds', role: 'Gunner', max: 2, prio: 6, text: 'AP does 40% more damage and passes through one more bug.', apply: g => { g.st.ap *= 1.4; g.st.pierce++; } },
  bigbang: { name: 'Big bang', role: 'Gunner', max: 2, prio: 5, text: 'HE blasts are 35% wider and hit 25% harder.', apply: g => { g.st.heRad *= 1.35; g.st.he *= 1.25; } },
  flak:    { name: 'Wide flak', role: 'Gunner', max: 2, prio: 4, text: 'Three more flak pellets, reaching 25% further.', apply: g => { g.st.flakN += 3; g.st.flakLife *= 1.25; } },
  cool:    { name: 'Cool barrel', role: 'Gunner', max: 2, prio: 4, text: 'The machine gun overheats 40% slower and hits 30% harder.', apply: g => { g.st.mgHeat *= 0.6; g.st.mg *= 1.3; } },
  twin:    { name: 'Twin barrel', role: 'Gunner', max: 1, prio: 9, needs: g => g.wave >= 4, text: 'The main gun fires two shells at once.', apply: g => { g.st.twin = true; } },
  plate:   { name: 'Plating', role: 'Driver', max: 3, prio: 5, text: '80 more hull, and 80 repaired now.', apply: g => { g.baseHp += 80; g.fitHull(); g.tank.hp = Math.min(g.tank.maxHp, g.tank.hp + 80); } },
  plough:  { name: 'Ram plough', role: 'Driver', max: 1, prio: 6, text: 'Boost into bugs for triple ram damage. Crawlers no longer hurt you when you ram them.', apply: g => { g.st.plough = true; } },
  turbo:   { name: 'Turbo', role: 'Driver', max: 2, prio: 4, text: 'Boost lasts 50% longer and refills faster. 8% more top speed.', apply: g => { g.st.boostDrain *= 0.66; g.st.boostRegen *= 1.4; g.st.speed *= 1.08; } },
  mines:   { name: 'Mine layer', role: 'Driver', max: 2, prio: 6, text: 'The driver presses A to drop a mine behind the tank.', apply: g => { g.st.mines++; } },
  repair:  { name: 'Field repair', role: 'Both of you', max: 2, prio: 5, text: 'The hull slowly repairs itself, all the time.', apply: g => { g.st.regen += 1.6; } },
  racks:   { name: 'Ammo racks', role: 'Both of you', max: 2, prio: 4, text: 'Carry 50% more HE and flak, and fill up now.', apply: g => { const t = g.tank; t.cap.he = Math.round(t.cap.he * 1.5); t.cap.flak = Math.round(t.cap.flak * 1.5); t.res.he = t.cap.he; t.res.flak = t.cap.flak; } },
};

// ---- Music -------------------------------------------------------------------------------------------
const SONG = { bpm: 104, root: 49, tracks: [
  { wave: 'triangle', oct: 1, vol: 0.11, len: 1.4, notes: [0, null, 0, null, null, null, 0, null, 3, null, 3, null, null, null, 5, null] },
  { wave: 'noise', vol: 0.05, len: 0.06, freq: 220, notes: [1, null, null, null, 1, null, null, null, 1, null, null, null, 1, null, 1, null] },
  { wave: 'noise', vol: 0.02, len: 0.03, freq: 8000, at: 0.3, notes: [null, null, 1, null, null, null, 1, null, null, null, 1, null, null, null, 1, 1] },
  { wave: 'square', oct: 3, vol: 0.018, len: 0.8, at: 0.6, notes: [7, null, 7, null, 10, null, 7, null, 5, null, 5, null, 3, null, 2, null] },
] };

// ---- Pictures -----------------------------------------------------------------------------------------
function foeShape(c, id, r, col) {

    ctl.x = bx; ctl.y = by; if (danger || (this.st.plough && foes.some(e => e.type === 'crawler' && U.dist(e.x, e.y, t.x, t.y) < 300))) ctl.set('rt', 1);

    if (!best) { if (!r && t.mag < t.magMax && Math.floor(this.time * 10) % 2) ctl.set('x'); return; }
    let want = 'ap';
    const front = FOES[best.type].armour && Math.abs(U.angleDiff(best.a, Math.atan2(t.y - best.y, t.x - best.x))) < FOES[best.type].armour;
    let crowd = 0; this.world.near(best.x, best.y, 160, 'enemy', () => crowd++);
    if ((best.type === 'hornet' || crowd >= 3) && t.res.flak > 0 && U.dist(best.x, best.y, t.x, t.y) < 440) want = 'flak';
    else if ((front || crowd >= 3 || best.type === 'siege') && t.res.he > 0) want = 'he';
    const sh = SHELLS.findIndex(q => q.id === want);
    if (sh !== t.shell && Math.floor(this.time * 10) % 2) ctl.set('rb');
    const sp = SHELLS[t.shell].speed, d = U.dist(best.x, best.y, t.x, t.y), lead = d / sp * 0.5;   // people lead about half as much as they should
    if (best !== this._bt) { this._bt = best; this._bj = U.gauss(k.rng) * 0.05; }
    const px = best.x + best.vx * lead - t.vx * lead, py = best.y + best.vy * lead - t.vy * lead, aim = Math.atan2(py - t.y, px - t.x) + this._bj;
    ctl.x = Math.cos(aim); ctl.y = Math.sin(aim);
    const off = Math.abs(U.angleDiff(t.ta, aim));
    if (off < (t.shell === 2 ? 0.2 : 0.07) && this.map.los(t.x, t.y, best.x, best.y)) ctl.set('rt', 1);
    if (off < 0.25 && d < 500 && (best.type === 'hornet' || best.type === 'crawler') && t.heat < 0.85 && !t.over) ctl.set('lt', 1);
  }
  dev(code) {
    if (code === 'F7' && this.fighting) { this.skip = true; this.world.each('enemy', e => this.kill(e)); this.left = 0; }
    if (code === 'F8') this.tank.hp = this.tank.maxHp;
  }

  // ---- Drawing -------------------------------------------------------------------------------------------
  draw() {
    const k = this.k, c = k.c, cam = this.cam, v = cam.view(), t = this.tank;
    cam.begin(c);
    this.map.draw(c, v);
    for (const gt of this.gates) {                           // where bugs come in; they glow just before
      const pulse = gt.warn > 0 ? 0.5 + 0.5 * Math.sin(this.time * 18) : 0;
      G.circle(gt.x, gt.y, 46, gt.warn > 0 ? `rgba(240,97,109,${0.15 + pulse * 0.25})` : 'rgba(255,255,255,0.03)', gt.warn > 0 ? T.bad : T.line2, 3);
    }
    for (const m of this.mines) { G.circle(m.x, m.y, m.big ? 18 : 14, T.s3, T.p[this.driver.index], 3); if (m.arm <= 0 && Math.floor(this.time * 3) % 2) G.circle(m.x, m.y, 5, T.bad); }
    this.world.draw(c, v);
    for (const s of this.shells) {
      if (s.kind === 'he') G.circle(s.x, s.y, 10, PEACH, T.bg, 3);
      else { const col = s.kind === 'flak' ? ICE : s.kind === 'mg' ? T.p[this.gunner.index] : T.text, f = s.kind === 'mg' ? 0.012 : 0.02; G.line(s.x - s.vx * f, s.y - s.vy * f, s.x, s.y, col, s.kind === 'ap' ? 7 : 4); }
    }
    this.drawTank(c, t);
    for (const b of this.bolts) { G.circle(b.x, b.y, b.r, 'rgba(240,97,109,0.35)', T.bad, 3); G.circle(b.x, b.y, 4, '#FFFFFF'); }
    for (const r of this.rings) { const f = r.t / r.life; c.globalAlpha = (1 - f) * 0.3; G.circle(r.x, r.y, r.rad * (0.5 + 0.5 * f), r.col); c.globalAlpha = 1 - f; G.circle(r.x, r.y, r.rad * (0.5 + 0.5 * f), null, r.col, 4); c.globalAlpha = 1; }
    this.fx.draw(c); this.floats.draw();
    cam.end(c);
    this.world.each('enemy', e => { if (e.type === 'siege') cam.indicator(e.x, e.y, T.bad); });
    this.world.each('pickup', p => cam.indicator(p.x, p.y, 'rgba(46,189,133,0.8)'));
    this.hud();
  }
  drawTank(c, t) {
    const dc = T.p[this.driver.index], gc = T.p[this.gunner.index], flash = t.hurtT > 0;
    if (!this.over) { c.globalAlpha = 0.18; G.line(t.x + Math.cos(t.ta) * 80, t.y + Math.sin(t.ta) * 80, t.x + Math.cos(t.ta) * 1000, t.y + Math.sin(t.ta) * 1000, gc, 2); c.globalAlpha = 1; }   // aiming line
    c.save(); c.translate(t.x, t.y); c.rotate(t.a);
    G.rrect(-52, -48, 104, 20, 8, T.s3, T.line2, 2); G.rrect(-52, 28, 104, 20, 8, T.s3, T.line2, 2);   // tracks
    const tr = (this.time * t.v * 0.15) % 16; c.strokeStyle = T.line2; c.lineWidth = 2;
    for (let x = -48 + ((tr + 16) % 16); x < 50; x += 16) { c.beginPath(); c.moveTo(x, -46); c.lineTo(x, -30); c.moveTo(x, 30); c.lineTo(x, 46); c.stroke(); }
    G.rrect(-44, -32, 88, 64, 12, flash ? '#FFFFFF' : 'rgba(17,21,28,0.9)', dc, 5);
    G.marker(this.driver.index, -22, 0, 9, { color: dc });
    c.restore();
    c.save(); c.translate(t.x, t.y); c.rotate(t.ta);
    const rc = -t.recoil * 12;
    if (this.st.twin) { G.rrect(rc + 10, -18, 66, 12, 5, gc); G.rrect(rc + 10, 6, 66, 12, 5, gc); } else G.rrect(rc + 10, -8, 70, 16, 6, gc);
    G.rrect(18, 12, 30, 7, 3, t.over ? T.bad : T.muted);   // machine gun
    G.circle(0, 0, 27, T.s2, gc, 5); G.marker(this.gunner.index, 0, 0, 8, { color: gc });
    c.restore();
    const r = t.rel;
    if (r && r.g0 != null) {                                  // the reload bar: press X in the green
      const w = 240, x = t.x - w / 2, y = t.y - 108;
      G.rrect(x - 6, y - 6, w + 12, 30, 10, 'rgba(7,9,13,0.88)');
      G.rrect(x, y, w, 18, 6, T.s3);
      G.rrect(x + w * r.g0, y, w * (r.g1 - r.g0), 18, 4, 'rgba(46,189,133,0.45)'); G.rrect(x + w * r.p0, y, w * (r.p1 - r.p0), 18, 4, T.good);
      const p = Math.min(1, r.t / r.dur); G.rrect(x + w * p - 4, y - 8, 8, 34, 4, r.jam ? T.bad : T.text);
    }
  }
  hud() {
    const t = this.tank, k = this.k, c = k.c;
    // hull, top left
    G.panel(40, 40, 520, 76); G.eyebrow('Hull', 64, 85);
    G.bar(150, 72, 260, 14, t.hp / t.maxHp, t.hp < t.maxHp * 0.3 ? T.bad : T.text);
    G.text(Math.ceil(t.hp) + ' / ' + t.maxHp, 536, 86, { size: FS.xs, mono: true, color: T.muted, align: 'right' });
    // wave, top centre
    const alive = this.world.count('enemy'), left = alive + Math.max(0, this.left), ww = 420, wx = (W - ww) / 2;
    G.panel(wx, 40, ww, 76); G.eyebrow(this.wave ? (this.wave === WAVES ? 'Final wave' : 'Wave ' + this.wave + ' of ' + WAVES) : 'Get ready', wx + 24, 85);
    G.text(left + ' left', wx + ww - 24, 90, { size: FS.sm, mono: true, align: 'right' });
    // time, top right
    G.panel(W - 240, 40, 200, 76); G.eyebrow('Time', W - 216, 85); G.text(clock(this.time), W - 64, 90, { size: FS.sm, mono: true, align: 'right' });
    // driver panel, bottom left
    const ph = 120, py = H - 40 - ph, d = this.driver, gn = this.gunner;
    G.panel(40, py, 560, ph);
    G.marker(d.index, 70, py + 36, 12); G.eyebrow('Player ' + (d.index + 1) + ' · Driver', 94, py + 43, { color: T.p[d.index] });
    G.text('Boost', 64, py + 86, { size: FS.xs, color: T.muted, base: 'middle' });
    G.bar(150, py + 80, 220, 12, t.boost, t.boosting ? T.p[d.index] : T.text);
    if (this.st.mines) {
      const ready = t.mineCd <= 0; G.glyph(d.type, 'a', 400, py + 86, 34, { names: d.device && d.device.names, lit: ready, color: T.p[d.index] });
      G.text(ready ? 'Mine ready' : 'Mine ' + Math.max(0, t.mineCd).toFixed(1) + 's', 444, py + 87, { size: FS.xs, color: ready ? T.text : T.faint, base: 'middle' });
    }
    // gunner panel, bottom right
    const gx = W - 40 - 640; G.panel(gx, py, 640, ph);
    G.marker(gn.index, gx + 30, py + 36, 12); G.eyebrow('Player ' + (gn.index + 1) + ' · Gunner', gx + 54, py + 43, { color: T.p[gn.index] });
    for (let i = 0; i < t.magMax; i++) G.rrect(gx + 330 + i * 18, py + 26, 10, 22, 3, i < t.mag && !t.rel ? T.text : T.s3);
    G.text(t.rel ? (t.rel.jam ? 'Jammed' : 'Reloading') : t.buff > 0 ? 'Perfect · +25%' : '', gx + 616, py + 43, { size: FS.xs, weight: 500, color: t.rel && t.rel.jam ? T.bad : t.buff > 0 && !t.rel ? T.good : T.muted, align: 'right' });
    SHELLS.forEach((sh, i) => {
      const x = gx + 24 + i * 140, y = py + 64, on = i === t.shell, n = i ? t.res[sh.id] : null;
      G.rrect(x, y, 128, 40, 20, on ? T.s3 : null, on ? sh.col : T.line, on ? 3 : 2);
      G.circle(x + 22, y + 20, 7, sh.col);
      G.text(sh.name, x + 38, y + 21, { size: FS.xs, weight: on ? 700 : 400, color: on ? T.text : T.muted, base: 'middle' });
      G.text(n == null ? '∞' : String(n), x + 112, y + 21, { size: FS.xs, mono: true, color: n === 0 ? T.bad : T.muted, align: 'right', base: 'middle' });
    });
    G.text('MG', gx + 452, py + 85, { size: FS.xs, color: T.muted, base: 'middle' });
    G.bar(gx + 500, py + 79, 116, 12, t.heat, t.over ? T.bad : t.heat > 0.7 ? T.p[gn.index] : T.muted);
    // wave banner
    const b = this.banner;
    if (b) {
      const a = Math.min(1, b.t / 0.4, (3 - b.t) / 0.25); c.globalAlpha = U.clamp(a, 0, 1);
      G.text(b.title, W / 2, 420, { size: FS.xl, weight: 700, align: 'center' });
      if (b.sub) G.text(b.sub, W / 2, 480, { size: FS.sm, color: T.muted, align: 'center' });
      c.globalAlpha = 1;
    }
    // seat swap window
    if (this.swapT > 0) {
      const ps = k.players, w = 760, x = (W - w) / 2, y = H - 260;
      G.panel(x, y, w, 96);
      G.eyebrow('Next wave in ' + Math.ceil(this.swapT), x + 28, y + 38);
      const solo = ps.some(s => s.bot);
      G.inline(x + 28, y + 70, [solo ? 'Press ' : 'Both press ', { btn: 'y' }, ' to swap seats'], Couch.Input.lastType, { size: FS.xs, color: T.muted });
      ps.forEach((s, i) => { if (s.bot) return; const on = this.swapWant[s.index]; G.marker(s.index, x + w - 80 + i * 40, y + 48, 12, { hollow: !on }); });
    }
  }
}

Couch.register({
  id: 'tank-for-two', players: 2, bots: true, best: 'low', scoreLabel: 'All ten waves in', formatScore: clock,
  line: 'One drives, one guns, same tank.',
  how: ['Player 1 drives. Player 2 aims and fires. You can swap seats between waves.',
    'Drive over crates for ammo and repairs. Hit armoured bugs from the side, or with HE.',
    'Clear ten waves. After each one, one of you picks an upgrade. You take turns.'],
  controls: [
    [['move', 'Drive'], ['rt', 'Boost'], ['a', 'Drop a mine (with the upgrade)'], ['y', 'Swap seats between waves'], ['start', 'Pause']],
    [['move', 'Aim the turret'], ['rt', 'Fire the main gun'], ['lt', 'Machine gun'], ['x', 'Reload, then again in the green'], ['rb', 'Change shell (LB back)']],
  ],
  assistText: ['', 'Driver: more hull. Gunner: aim help, wider green.', 'Driver: much more hull. Gunner: strong aim help.'],
  create: k => new TankForTwo(k),
});
})();
</script>
